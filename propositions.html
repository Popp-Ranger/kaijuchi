<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaijuchi — 5 propositions de monstre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a2140;--cream:#fff6dd}
*{box-sizing:border-box}
body{margin:0;padding:24px 16px 56px;min-height:100vh;color:var(--ink);
  font-family:'Baloo 2','Fredoka','Trebuchet MS',system-ui,sans-serif;font-weight:600;
  background:radial-gradient(rgba(255,255,255,.16) 2px,transparent 2.6px) 0 0/28px 28px,linear-gradient(160deg,#5b54f0 0%,#a557f5 48%,#ff78b4 100%);background-attachment:fixed}
.app{max-width:1060px;margin:0 auto;background:var(--cream);border:4px solid var(--ink);border-radius:34px;padding:18px;
  box-shadow:0 10px 0 var(--ink),0 28px 50px rgba(30,10,80,.4)}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 4px 6px}
.logo{font-weight:800;font-size:38px;line-height:1;color:#ff7a3d;letter-spacing:.5px;margin-right:6px;
  text-shadow:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink),2px 2px var(--ink),-2px 2px var(--ink),2px -2px var(--ink),-2px -2px var(--ink),0 6px 0 var(--ink)}
.chip{background:#ffd166;border:3px solid var(--ink);border-radius:999px;padding:1px 14px;font-weight:800;font-size:16px;box-shadow:0 3px 0 var(--ink)}
.intro{margin:10px 6px 16px;font-size:16px;font-weight:700;opacity:.8;line-height:1.3}
.pc{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start;background:#fff;border:4px solid var(--ink);border-radius:26px;padding:12px;box-shadow:0 7px 0 var(--ink);margin-bottom:22px}
.frame{border:4px solid var(--ink);border-radius:20px;overflow:hidden;background:var(--cb)}
.frame svg{display:block;width:100%;height:auto}
.hd{display:flex;align-items:center;gap:12px;margin-top:2px}
.num{flex:none;width:52px;height:52px;border-radius:50%;background:var(--col);border:4px solid var(--ink);display:grid;place-items:center;font-size:30px;font-weight:800;line-height:1;box-shadow:0 4px 0 var(--ink);color:#fff;
  text-shadow:0 2px 0 var(--ink),1px 0 var(--ink),-1px 0 var(--ink),0 -1px var(--ink)}
.nm{font-size:34px;font-weight:800;line-height:1}
.tag{font-size:16px;font-weight:800;opacity:.65;line-height:1.1}
.info p{margin:10px 0 8px;font-size:16px;font-weight:700;line-height:1.25}
.tr{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.tr li{background:var(--cream);border:3px solid var(--ink);border-radius:999px;padding:0 11px;font-size:13.5px;font-weight:800;white-space:nowrap}
.sw{display:flex;gap:6px;margin:10px 0 0;align-items:center;font-size:13px;font-weight:800;opacity:.9}
.sw i{width:26px;height:26px;border-radius:50%;border:3px solid var(--ink);display:block}
.grow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.grow figure{margin:0;text-align:center}
.grow .frame{border-width:3px;border-radius:14px}
.grow figcaption{font-size:14px;font-weight:800;margin-top:2px}
@media(max-width:700px){.pc{grid-template-columns:minmax(0,1fr)}.logo{font-size:30px}.nm{font-size:30px}}
svg .ol{stroke:var(--ink);stroke-width:calc(var(--lw,1)*5px);stroke-linejoin:round;stroke-linecap:round}
svg .ol2{stroke:var(--ink);stroke-width:calc(var(--lw,1)*3.2px);stroke-linejoin:round;stroke-linecap:round}
.breath{animation:breath 2.6s ease-in-out infinite;transform-origin:0 0}
@keyframes breath{50%{transform:scale(1.012,.978)}}
.nod{animation:nod 2.6s ease-in-out infinite;transform-origin:-30px 20px}
@keyframes nod{50%{transform:rotate(2deg)}}
.lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink 4.2s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%,97%{transform:scaleY(1)}}
.flm{animation:flm .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flm{to{transform:scale(1.12,.86)}}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.15)}}
.smk{animation:smk 3.5s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes smk{0%{transform:translateY(0) scale(.5);opacity:0}20%{opacity:.8}100%{transform:translateY(-60px) scale(1.5);opacity:0}}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.wig{animation:wig 1.8s ease-in-out infinite alternate;transform-origin:0 0}
@keyframes wig{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="logo">KAIJUCHI</div><div class="chip">5 propositions pour le monstre</div></div>
  <div class="intro">Chaque proposition est montrée à l'âge adulte, puis en bébé et en titan pour voir comment elle grandit. Les noms sont provisoires.</div>
  <div id="list"></div>
</div>
<script>
const L='#2a2140',IV='#fff8e1';
function mb(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const f=n=>(+n).toFixed(1),f2=n=>(+n).toFixed(2);
function star(cx,cy,R,r,n){let s='';for(let i=0;i<n*2;i++){const a=Math.PI*i/n-Math.PI/2,q=i%2?r:R;s+=f(cx+Math.cos(a)*q)+','+f(cy+Math.sin(a)*q)+' '}return s}

/* ---------- stades ---------- */
const STG={
 bebe:{n:'Bébé',bs:.55,hs:.95,ss:.5,es:1.28,brow:-10,pup:.62,cheek:1,teeth:1,vb:[-180,-250,350,277]},
 adulte:{n:'Adulte',bs:1,hs:1,ss:1,es:1,brow:12,pup:.46,teeth:3},
 titan:{n:'Titan',bs:1.15,hs:.96,ss:1.35,es:.92,brow:20,slit:1,glow:1,scar:1,teeth:4,vb:[-335,-432,590,467]}
};

/* ---------- briques communes ---------- */
const ol=(d,fill,x='')=>`<path class="ol" d="${d}" fill="${fill}" ${x}/>`,ol2=(d,fill,x='')=>`<path class="ol2" d="${d}" fill="${fill}" ${x}/>`;
const tooth=(x,y,w,h)=>ol2(`M${f(x-w)} ${f(y)} L${f(x)} ${f(y+h)} L${f(x+w)} ${f(y)} Z`,'#fff');
const marks=(a,col,o=.6)=>`<path d="${a.map(q=>`M${q[0]} ${q[1]} q7 8 14 0`).join(' ')}" stroke="${col}" stroke-width="3.2" fill="none" stroke-linecap="round" opacity="${o}"/>`;
const TX={1:[70],3:[38,56,74,92],4:[32,47,62,77,92]},lipY=x=>22-(x-18)*8/68;
const SH={
 spike:t=>`<path class="ol" d="M-17 8 C-16 -14,-7 -32,3 -50 C10 -32,18 -14,17 8 Z" fill="${t.gs}"/><path d="M-4 2 C-3 -12,1 -24,3 -37 C6 -24,9 -10,9 2 Z" fill="#fff" opacity=".45"/>`,
 plate:t=>`<path class="ol" d="M-20 8 L-26 -9 L-14 -9 L-19 -30 L-7 -25 L1 -56 L9 -25 L21 -31 L16 -9 L27 -11 L20 8 Z" fill="${t.gs}"/><path d="M-6 4 L-7 -14 L1 -40 L7 -14 L7 4 Z" fill="#fff" opacity=".55"/>`,
 gum:t=>`<path class="ol" d="M-17 6 C-20 -14,-11 -30,0 -30 C11 -30,20 -14,17 6 Z" fill="${t.gs}"/><ellipse cx="-5" cy="-16" rx="4" ry="7" fill="#fff" opacity=".65" transform="rotate(18 -5 -16)"/>`,
 flame:t=>`<g class="flm"><path class="ol" d="M-17 8 C-27 -12,-13 -22,-11 -40 C-2 -30,1 -22,4 -58 C17 -40,25 -18,17 8 Z" fill="${t.gs}"/><path d="M-7 6 C-11 -8,-2 -14,2 -30 C8 -18,12 -6,8 6 Z" fill="#fff6b0"/></g>`,
 cone:t=>`<path class="ol" d="M-13 6 L1 -36 L13 6 Z" fill="${IV}"/><path d="M4 2 L2 -24 L10 4 Z" fill="#e2bf7c" opacity=".7"/>`
};
function orn(k,t,x,y,r,s,ps){return `<g transform="translate(${x},${y}) rotate(${r}) scale(${f2(s)})" style="--lw:${f2(1/(s*ps))}">${SH[k](t)}</g>`}
function orns(k,t,list,ps,sc=1,glow=t.glow){const a=list.map(o=>orn(k,t,o[0],o[1],o[2],o[3]*sc,ps)).join('');return (glow?`<g filter="${t.fl}" opacity=".9">${a}</g>`:'')+a}
function torso(t,body,b,o={}){const{c,G,gb}=t;let bl='';for(let y=b[1]-b[3]+18;y<b[1]+b[3];y+=25)bl+=`<path d="M${b[0]-b[2]-8} ${y} Q${b[0]} ${y+13} ${b[0]+b[2]+8} ${y}"/>`;
 return `<clipPath id="${G('cb')}"><path d="${body}"/></clipPath><clipPath id="${G('cl')}"><ellipse cx="${b[0]}" cy="${b[1]}" rx="${b[2]}" ry="${b[3]}"/></clipPath>
 <path d="${body}" fill="${gb}"/><g clip-path="url(#${G('cb')})"><ellipse cx="${b[0]}" cy="${b[1]}" rx="${b[2]}" ry="${b[3]}" fill="url(#${G('gl')})"/><g clip-path="url(#${G('cl')})" stroke="${c.bl}" stroke-width="3.5" fill="none" stroke-linecap="round">${bl}</g>${o.inside||''}
 <path d="${o.shade||'M-90 -40 C-60 -10,0 -6,60 -16 L60 0 L-100 0 Z'}" fill="${L}" opacity=".16"/></g><path class="ol" d="${body}" fill="none"/>`}
function eye(t,x,y,r,k=1){const{p,c,G}=t,ir=r*.64,px=r*.24,py=r*.06;let s=`<g transform="translate(${x},${y}) scale(${f2(p.es*k)})">`;
 if(p.glow)s+=`<circle r="${f(r*1.4)}" fill="${c.glow}" opacity=".75" filter="${t.fl}"/>`;
 s+=`<ellipse class="ol" rx="${f(r*.93)}" ry="${r}" fill="#fff"/><circle cx="${f(px)}" cy="${f(py)}" r="${f(ir)}" fill="url(#${G('ge')})"/><circle cx="${f(px)}" cy="${f(py)}" r="${f(ir)}" fill="none" stroke="${L}" stroke-width="1.5" opacity=".5"/>`;
 s+=p.slit?`<ellipse cx="${f(px+2)}" cy="${f(py)}" rx="${f(r*.17)}" ry="${f(ir*.86)}" fill="${L}"/>`:`<circle cx="${f(px+2)}" cy="${f(py)}" r="${f(ir*p.pup)}" fill="${L}"/>`;
 return s+`<circle cx="${f(r*.5)}" cy="${f(-r*.26)}" r="${f(r*.23)}" fill="#fff"/><circle cx="${f(r*.02)}" cy="${f(r*.4)}" r="${f(r*.11)}" fill="#fff"/><ellipse class="lid" rx="${f(r*.98)}" ry="${f(r*1.05)}" fill="${c.body}" stroke="${L}" stroke-width="3"/></g>`}
const brow=(t,x,y,w,k=1)=>`<g transform="rotate(${f(t.p.brow*k)} ${x} ${y})"><path d="M${x-w/2} ${y+1} Q${x} ${f(y-w*.2)} ${x+w/2} ${y+3}" stroke="${t.c.dark}" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M${x-w/2} ${y-4} Q${x} ${f(y-w*.2-5)} ${x+w/2} ${y-2}" stroke="${L}" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".8"/></g>`;
const scar=(t,x,y)=>t.p.scar?`<path d="M${x} ${y} l16 34 M${x+10} ${y-2} l13 27" stroke="#ffd9e8" stroke-width="3.5" stroke-linecap="round" fill="none"/>`:'';
const ground=col=>`<path d="M-460 4 Q-30 -16 460 4 L460 90 L-460 90 Z" fill="${col}"/>`;

const LEG='M-14 -70 C-14 -110,18 -118,42 -112 C70 -104,80 -78,74 -52 C72 -42,80 -32,92 -27 C108 -20,104 0,88 0 L26 0 C4 0,-6 -12,-4 -34 C-10 -44,-14 -56,-14 -70 Z';
const NAILS=`<path class="ol2" d="M90 -25 L113 -15 L93 -10 Z" fill="${IV}"/><path class="ol2" d="M95 -13 L116 -3 L95 0 Z" fill="${IV}"/><path class="ol2" d="M68 -9 L84 -2 L68 0 Z" fill="${IV}"/>`;
const ARM='M28 -182 C52 -192,98 -165,116 -138 C124 -126,112 -110,98 -116 C76 -126,48 -138,26 -146 C14 -152,16 -176,28 -182 Z';
const CLAWS=`<path class="ol2" d="M107 -141 L129 -139 L113 -128 Z" fill="${IV}"/><path class="ol2" d="M106 -129 L126 -121 L106 -116 Z" fill="${IV}"/>`;
const BODY='M-75 -60 C-95 -130,-60 -215,5 -225 C65 -232,95 -180,92 -120 C90 -60,65 -22,10 -18 C-35 -15,-65 -30,-75 -60 Z';
const TAIL='M-40 -100 C-100 -105,-165 -85,-200 -50 C-215 -35,-232 -45,-238 -62 C-246 -30,-225 -2,-190 -2 C-140 -2,-90 -8,-40 -14 Z';
const legHi=`<ellipse cx="36" cy="-92" rx="22" ry="11" fill="#fff" opacity=".22" transform="rotate(-18 36 -92)"/><path d="M26 -3 L88 -3" stroke="${L}" stroke-width="4" opacity=".14"/>`;
const armHi=`<path d="M38 -176 C58 -176,84 -160,100 -142" stroke="#fff" stroke-width="5" fill="none" opacity=".25" stroke-linecap="round"/>`;

/* ---------- les cinq monstres ---------- */
const D=[
/* 1 — le classique */
{id:'g',name:'Grondo',tag:'Le classique',col:'#5b6c9a',H:[48,-258],vb:[-266,-360,484,383],cb:'radial-gradient(circle at 50% 30%,#f2f5ff,#aab9e8)',
 txt:"Le kaiju de cinéma : massif, dos hérissé de plaques, mâchoire pleine de crocs. Le plus proche de ce qu'on imagine en pensant « monstre géant ».",
 tr:['Plaques dorsales dentelées','Crocs qui dépassent','Regard féroce'],
 c:{body:'#5b6c9a',hi:'#aebee6',dark:'#2c375e',belly:'#f4f6ff',belly2:'#b3bcdf',bl:'#8a94c0',sp:'#effeff',sp2:'#2fb8e6',i1:'#ffe27a',i2:'#e8590c',glow:'#7df9ff'},
 bg(){const r=mb(7);let s='';for(let x=-262;x<215;x+=34+r()*12){const h=34+r()*74,w=24+r()*10;s+=`<rect x="${f(x)}" y="${f(-h)}" width="${f(w)}" height="${f(h+6)}" rx="3" fill="#fff" opacity=".55"/>`;for(let y=-h+8;y<-10;y+=14)s+=`<rect x="${f(x+5)}" y="${f(y)}" width="5" height="6" fill="#7f93cf" opacity=".55"/><rect x="${f(x+w-10)}" y="${f(y)}" width="5" height="6" fill="#7f93cf" opacity=".55"/>`}return s+ground('#8fa0d8')},
 body(t){const{c,gb}=t;
  let s=orns('plate',t,[[-96,-97,-10,.66],[-142,-84,-24,.56],[-182,-62,-40,.46]],t.bs,t.ss);
  s+=ol(TAIL,gb)+`<path d="M-196 -6 C-140 -6,-90 -11,-44 -17 C-90 -26,-150 -24,-200 -14 Z" fill="${c.belly2}" opacity=".7"/><ellipse cx="-112" cy="-66" rx="13" ry="7" fill="${c.dark}" opacity=".35" transform="rotate(-14 -112 -66)"/><ellipse cx="-158" cy="-46" rx="10" ry="6" fill="${c.dark}" opacity=".35" transform="rotate(-28 -158 -46)"/><path d="M-60 -92 C-110 -96,-160 -78,-192 -50" stroke="#fff" stroke-width="5" fill="none" opacity=".22" stroke-linecap="round"/>`;
  s+=orns('plate',t,[[-72,-76,-98,.8],[-79,-116,-80,1.1],[-65,-166,-58,1.3],[-36,-206,-34,1.1]],t.bs,t.ss);
  s+=`<g transform="translate(-58,-4)">${ol(LEG,c.dark)}${NAILS}</g><g transform="translate(24,-8)">${ol(ARM,c.dark)}${CLAWS}</g>`;
  s+=torso(t,BODY,[72,-116,56,98])+marks([[-52,-150],[-36,-174],[-58,-118],[-34,-130],[-52,-88],[-16,-198],[-30,-100],[-12,-152]],c.dark)+`<ellipse cx="-30" cy="-196" rx="22" ry="9" fill="#fff" opacity=".2" transform="rotate(-28 -30 -196)"/>`;
  s+=`<g transform="translate(6,0)">${ol(LEG,gb)}${NAILS}${legHi}${marks([[6,-66],[22,-48],[38,-66]],c.dark,.55)}</g>${ol(ARM,gb)}${CLAWS}${armHi}`;
  return s},
 head(t){const{c,gb,p}=t;let s=orns('plate',t,[[-52,-46,-52,.6],[-24,-68,-26,.7]],t.hs,t.ss);
  s+=ol('M-50 -32 C-76 -48,-96 -32,-92 -8 C-78 -14,-62 -8,-50 2 Z',c.dark)+`<path d="M-60 -26 C-74 -30,-82 -24,-84 -16" stroke="${c.hi}" stroke-width="3" fill="none" stroke-linecap="round" opacity=".6"/>`;
  s+=ol('M-46 4 C-44 42,0 62,52 58 C90 54,112 38,108 8 Z',c.body)+`<path d="M-30 32 C-10 50,30 56,58 52 C86 48,102 38,104 24 C92 40,62 46,30 46 C6 46,-16 40,-30 32Z" fill="${c.dark}" opacity=".5"/>`;
  s+=ol('M-64 -6 C-68 -52,-30 -76,12 -74 C40 -72,56 -60,66 -48 C92 -48,118 -36,118 -12 C118 6,104 13,86 14 L18 22 C-22 30,-60 22,-64 -6 Z',gb);
  s+=`<ellipse cx="-4" cy="-60" rx="30" ry="8" fill="#fff" opacity=".25" transform="rotate(-6 -4 -60)"/><path d="M70 -42 Q96 -40 110 -22" stroke="#fff" stroke-width="5" fill="none" opacity=".3" stroke-linecap="round"/><path d="M-58 2 C-40 18,-10 20,18 16 L18 21 C-20 29,-56 22,-62 0 Z" fill="${L}" opacity=".15"/>
  <ellipse cx="102" cy="-24" rx="5" ry="3.6" fill="${L}" transform="rotate(20 102 -24)"/><circle cx="-38" cy="-30" r="3" fill="${c.dark}" opacity=".6"/><circle cx="-30" cy="-42" r="2.4" fill="${c.dark}" opacity=".6"/><circle cx="-44" cy="-18" r="2.2" fill="${c.dark}" opacity=".6"/>`;
  TX[p.teeth].forEach(x=>s+=tooth(x,lipY(x),5.5,p.teeth<3?9:12));
  s+=ol2('M100 12 L104 23 L109 9 Z','#fff');
  if(p.teeth>1)s+=ol2('M45 31 L49 9 L58 29 Z','#fff')+ol2('M82 26 L88 5 L95 23 Z','#fff');
  if(p.cheek)s+=`<ellipse cx="-14" cy="4" rx="14" ry="8.5" fill="#ff7fa8" opacity=".6"/>`;
  return s+eye(t,24,-28,19)+brow(t,26,-55,58,1.25)+scar(t,42,-70)}},

/* 2 — le dodu */
{id:'m',name:'Mochi',tag:'Le dodu',col:'#8fd93f',H:[14,-216],lift:60,sh:130,vb:[-240,-352,470,372],cb:'radial-gradient(circle at 50% 30%,#fffbe0,#ffd0e2)',
 txt:"Tout rond, tout mignon, et toujours affamé. Le décalage fait rire : une peluche adorable qui croque des immeubles.",
 tr:['Grosse tête, petites pattes','Bosses façon bonbons','Joues roses'],
 c:{body:'#a6e658',hi:'#e6ffa8',dark:'#5fb335',belly:'#fffbd6',belly2:'#ffe08a',bl:'#efc45c',sp:'#ffc4dc',sp2:'#ff5f9c',i1:'#8fe9ff',i2:'#2a7fe0',glow:'#ffd0f0'},
 bg(){let s='';[[-190,-290,13,'#fff'],[150,-300,10,'#ff8fc0'],[190,-170,12,'#fff'],[-205,-150,9,'#ffd23f'],[105,-338,7,'#fff'],[-120,-326,8,'#ff8fc0']].forEach(q=>s+=`<polygon points="${star(q[0],q[1],q[2],q[2]*.42,4)}" fill="${q[3]}" opacity=".9"/>`);
  s+=ground('#ffb3cf');[[-200,-2,'#fff'],[-150,10,'#ffd23f'],[150,0,'#fff'],[196,10,'#ff5f9c'],[-90,14,'#ff5f9c']].forEach(q=>{for(let i=0;i<5;i++)s+=`<circle cx="${f(q[0]+Math.cos(i*1.257)*6)}" cy="${f(q[1]+Math.sin(i*1.257)*6)}" r="4.5" fill="${q[2]}"/>`;s+=`<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="#ffb02e"/>`});return s},
 body(t){const{c,gb}=t,B='M-100 -96 C-100 -160,-52 -196,6 -196 C66 -196,106 -152,106 -94 C106 -42,66 -10,6 -10 C-56 -10,-100 -42,-100 -96 Z',
   TL='M-66 -78 C-104 -90,-142 -76,-152 -50 C-158 -30,-148 -10,-124 -8 C-100 -6,-76 -10,-56 -20 Z',FT='M-30 -34 C-8 -50,38 -42,46 -18 C50 -6,42 0,32 0 L-24 0 C-40 0,-44 -18,-30 -34 Z',
   AR='M0 0 C16 -12,46 -4,52 14 C54 24,44 31,34 27 C20 22,6 18,-2 12 C-8 8,-6 2,0 0 Z',toes=`<path d="M22 -2 q2 -11 11 -8 M7 -2 q2 -11 11 -9" stroke="${L}" stroke-width="2.6" fill="none" stroke-linecap="round" opacity=".75"/>`;
  let s=orns('gum',t,[[-124,-76,-36,.62],[-148,-54,-66,.5]],t.bs,t.ss)+ol(TL,gb)+`<path d="M-140 -14 C-110 -8,-80 -12,-58 -22 C-90 -26,-120 -24,-144 -20 Z" fill="${c.belly2}" opacity=".7"/>`;
  s+=orns('gum',t,[[-93,-60,-112,.85],[-103,-112,-84,1.05],[-86,-162,-56,1.1],[-50,-191,-30,.95]],t.bs,t.ss);
  s+=`<g transform="translate(-34,-2)">${ol(FT,c.dark)}</g><g transform="translate(84,-132)">${ol(AR,c.dark)}</g>`;

  let s=orns('cone',t,studs,t.hs,1)+`<ellipse class="ol" cx="-36" cy="-24" rx="64" ry="74" fill="${gs}"/><ellipse cx="-40" cy="-24" rx="45" ry="55" fill="${c.hi}" opacity=".6"/><path d="M-40 -24 L-86 -62 M-40 -24 L-96 -20 M-40 -24 L-84 22 M-40 -24 L-52 -90" stroke="${c.sp2}" stroke-width="3" opacity=".6" stroke-linecap="round"/>`;
  s+=`<g transform="translate(-22,6)">${ol(HORN,'#d6c49a')}</g>`;
  s+=ol('M-40 8 C-36 36,4 50,50 46 C76 44,94 34,98 12 Z',c.body)+`<path d="M-28 28 C-8 42,28 46,52 42 C74 40,88 32,92 22 C80 32,58 36,30 36 C8 36,-14 34,-28 28Z" fill="${c.dark}" opacity=".5"/>`+ol2('M70 44 C86 42,98 32,100 14 L82 16 C84 28,78 38,70 44 Z','#ffc45e');
  s+=ol('M-56 -4 C-60 -44,-30 -64,8 -62 C40 -60,62 -48,78 -36 C100 -32,114 -22,114 -6 C114 6,106 12,94 14 L18 22 C-20 30,-52 20,-56 -4 Z',gb);
  s+=`<ellipse cx="-6" cy="-52" rx="26" ry="6" fill="#fff" opacity=".28" transform="rotate(-4 -6 -52)"/><path d="M-50 2 C-34 16,-10 19,18 16 L18 21 C-20 29,-48 20,-54 0 Z" fill="${L}" opacity=".14"/>`;
  s+=ol('M80 -36 C104 -36,122 -20,120 2 C118 16,110 26,100 30 C102 20,96 14,84 13 C90 0,90 -18,80 -36 Z','#ffd98a')+`<path d="M90 -30 C104 -28,114 -16,114 -2" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".6"/><ellipse cx="106" cy="-10" rx="3.6" ry="2.8" fill="${L}" transform="rotate(30 106 -10)"/>`;
  s+=ol(HORN,IV)+`<path d="M12 -70 q10 -6 18 -2 M22 -90 q8 -6 16 -2" stroke="#d9b877" stroke-width="3" fill="none" stroke-linecap="round"/>`+ol2('M66 -40 L84 -72 L92 -34 Z',IV);
  if(p.teeth>1)s+=tooth(42,lipY(42)+.4,5,9)+tooth(62,lipY(62)+.4,5,9);else s+=tooth(56,lipY(56)+.4,5,8);
  if(p.cheek)s+=`<ellipse cx="-14" cy="6" rx="13" ry="8" fill="#ff7fa8" opacity=".6"/>`;
  return s+eye(t,30,-18,18)+brow(t,30,-42,50,1)+scar(t,46,-56)}}
];

/* ---------- rendu ---------- */
function mon(d,sk){const p=STG[sk],c=d.c,bs=p.bs,hs=p.hs,G=n=>n+d.id+sk;
 const t={p,c,G,gb:`url(#${G('gb')})`,gs:`url(#${G('gs')})`,fl:`url(#${G('fl')})`,ss:p.ss,bs,hs,glow:p.glow||d.glow};
 let s=`<defs><radialGradient id="${G('gb')}" cx=".62" cy=".28" r=".9"><stop offset="0" stop-color="${c.hi}"/><stop offset=".5" stop-color="${c.body}"/><stop offset="1" stop-color="${c.dark}"/></radialGradient>
 <linearGradient id="${G('gl')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c.belly}"/><stop offset="1" stop-color="${c.belly2}"/></linearGradient>
 <linearGradient id="${G('gs')}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${c.sp2}"/><stop offset="1" stop-color="${c.sp}"/></linearGradient>
 <radialGradient id="${G('ge')}" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="${c.i1}"/><stop offset="1" stop-color="${c.i2}"/></radialGradient>
 <filter id="${G('fl')}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter></defs>`;
 s+=`<ellipse cx="-14" cy="3" rx="${f((d.sh||160)*bs)}" ry="${f(15*bs)}" fill="${L}" opacity=".24"/><g class="breath"><g transform="scale(${bs})" style="--lw:${f2(1/bs)}">${d.body(t)}</g>`;
 s+=`<g transform="translate(${f(d.H[0]*bs)},${f(d.H[1]*bs-(1-bs)*(d.lift||0))}) scale(${hs})" style="--lw:${f2(1/hs)}"><g class="nod">${d.head(t)}</g></g></g>`;
 return s}
const svg=(d,sk,vb)=>`<svg viewBox="${vb.join(' ')}" role="img" aria-label="${d.name}, ${STG[sk].n}">${d.bg()}${mon(d,sk)}</svg>`;
document.getElementById('list').innerHTML=D.map((d,i)=>`<section class="pc" style="--cb:${d.cb};--col:${d.col}">
 <div class="frame">${svg(d,'adulte',d.vb)}</div>
 <div class="info"><div class="hd"><span class="num">${i+1}</span><div><div class="nm">${d.name}</div><div class="tag">${d.tag}</div></div></div>
 <p>${d.txt}</p><ul class="tr">${d.tr.map(x=>`<li>${x}</li>`).join('')}</ul>
 <div class="sw">${[d.c.body,d.c.dark,d.c.belly2,d.c.sp2,d.c.sp].map(x=>`<i style="background:${x}"></i>`).join('')}</div>
 <div class="grow">${['bebe','titan'].map(k=>`<figure><div class="frame">${svg(d,k,STG[k].vb)}</div><figcaption>${STG[k].n}</figcaption></figure>`).join('')}</div></div></section>`).join('');
</script>
