<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaijuchi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a2140;--cream:#fff6dd;--k:1}
*{box-sizing:border-box}
body{margin:0;padding:24px 16px 56px;min-height:100vh;color:var(--ink);
  font-family:'Baloo 2','Fredoka','Trebuchet MS',system-ui,sans-serif;font-weight:600;
  background:radial-gradient(rgba(255,255,255,.16) 2px,transparent 2.6px) 0 0/28px 28px,linear-gradient(160deg,#5b54f0 0%,#a557f5 48%,#ff78b4 100%);background-attachment:fixed}
.app{max-width:1060px;margin:0 auto;background:var(--cream);border:4px solid var(--ink);border-radius:34px;padding:18px;
  box-shadow:0 10px 0 var(--ink),0 28px 50px rgba(30,10,80,.4)}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 4px 12px}
.logo{font-weight:800;font-size:38px;line-height:1;color:#ff7a3d;letter-spacing:.5px;margin-right:6px;
  text-shadow:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink),2px 2px var(--ink),-2px 2px var(--ink),2px -2px var(--ink),-2px -2px var(--ink),0 6px 0 var(--ink)}
.chip{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:1px 14px;font-weight:700;font-size:16px;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.chip b{font-weight:800}
.chip.stage{background:var(--sc,#ffd166);font-weight:800}
.sp{flex:1}
.screen{position:relative;border:4px solid var(--ink);border-radius:24px;overflow:hidden;background:#8fdcff;box-shadow:0 6px 0 var(--ink)}
.screen>svg{display:block;width:100%;height:auto}
.gauges{position:absolute;left:14px;right:14px;top:12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.gauge{display:flex;align-items:center}
.gauge .ic{width:42px;height:42px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:grid;place-items:center;flex:none;z-index:1;box-shadow:0 3px 0 var(--ink)}
.gauge .ic svg{width:28px;height:28px}
.gauge .trk{flex:1;height:24px;margin-left:-12px;background:rgba(42,33,64,.78);border:3px solid var(--ink);border-radius:0 14px 14px 0;overflow:hidden;position:relative;box-shadow:0 3px 0 var(--ink)}
.gauge .fill{height:100%;background:linear-gradient(var(--g1),var(--g2));border-radius:0 9px 9px 0;position:relative}
.gauge .fill::after{content:"";position:absolute;left:14px;right:5px;top:2px;height:5px;border-radius:4px;background:rgba(255,255,255,.6)}
.gauge .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 9px 0 18px;font-size:13px;font-weight:800;color:#fff;text-shadow:0 2px 0 var(--ink),1px 0 var(--ink),-1px 0 var(--ink)}
.gauge.low .fill{animation:low 1s infinite}
@keyframes low{50%{filter:brightness(1.5)}}
.row{display:flex;gap:14px;align-items:stretch;margin-top:16px;flex-wrap:wrap}
.evo{flex:1 1 100%;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px 14px 10px;box-shadow:0 4px 0 var(--ink)}
.evo .t{display:flex;justify-content:space-between;font-size:15px;font-weight:800}
.evo .bar{height:18px;border:3px solid var(--ink);border-radius:10px;background:#e9e2ff;overflow:hidden;margin-top:4px}
.evo .bar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,#9b6bff 0 12px,#b58cff 12px 24px);border-right:3px solid var(--ink);transition:width .6s}
.tray{flex:1 1 100%;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tray .tt{font-size:15px;font-weight:800;writing-mode:vertical-rl;transform:rotate(180deg);opacity:.7}
.food{flex:1 1 0;min-width:150px;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:5px 8px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 0 var(--ink)}
.food svg{width:50px;height:50px;flex:none;--k:1.5}
.food .n{font-size:15px;font-weight:800;line-height:1.05}
.food .v{font-size:13px;font-weight:700;color:#e2552c}
.actions{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:16px}
.btn{position:relative;border:4px solid var(--ink);border-radius:22px;background:linear-gradient(var(--b1),var(--b2));color:#fff;font:800 20px/1 inherit;font-family:inherit;
  padding:10px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 8px 0 var(--ink);cursor:pointer;
  text-shadow:0 2px 0 var(--ink),1px 0 var(--ink),-1px 0 var(--ink),0 -1px var(--ink);overflow:hidden}
.btn::before{content:"";position:absolute;left:8px;right:8px;top:5px;height:36%;border-radius:14px;background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.05))}
.btn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ink)}
.btn svg{width:50px;height:50px;position:relative}
.btn .lock{position:absolute;right:6px;top:6px;width:30px;height:30px;display:none}
.btn.locked{filter:saturate(.25) brightness(.9)}
.btn.locked .lock{display:block}
h2{font-size:20px;font-weight:800;margin:22px 6px 8px}
h2 small{font-size:14px;font-weight:700;opacity:.65;margin-left:8px}
.stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.card{background:var(--cb);border:4px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:6px 6px 10px;text-align:center;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:0 9px 0 var(--ink)}
.card.on{transform:translateY(-8px);box-shadow:0 14px 0 var(--ink);outline:4px solid #ff4f8b;outline-offset:3px}
.card svg{display:block;width:100%;height:auto;border-radius:14px}
.card .n{font-size:21px;font-weight:800;line-height:1.1;margin-top:4px}
.card .a{font-size:13px;font-weight:700;opacity:.7}
.card .m{font-size:14px;font-weight:700;line-height:1.15;margin-top:2px}
@media(max-width:760px){
  .gauges{position:static;grid-template-columns:repeat(2,minmax(0,1fr));padding:10px;background:#ffe9b0;border-bottom:4px solid var(--ink)}
  .gauge .lbl{white-space:nowrap}.gauge .lbl span:first-child{display:none}.gauge .lbl{justify-content:flex-end}
  .food{min-width:0;flex:1 1 40%}.food svg{width:40px;height:40px}.food .n{font-size:14px}
  .actions{gap:6px}.btn{font-size:11.5px;border-radius:14px;border-width:3px;padding:8px 0}.btn svg{width:34px;height:34px}
  .stages{grid-template-columns:repeat(3,minmax(0,1fr))}.logo{font-size:30px}.tray .tt{display:none}
}
/* dessin */
svg .o{stroke:var(--ink);stroke-width:calc(var(--k)*2.6px);stroke-linejoin:round;stroke-linecap:round}
svg .o2{stroke:var(--ink);stroke-width:calc(var(--k)*1.3px);stroke-linejoin:round;stroke-linecap:round}
svg .o3{stroke:var(--ink);stroke-width:calc(var(--k)*1.8px);stroke-linejoin:round;stroke-linecap:round}
svg .ol{stroke:var(--ink);stroke-width:calc(var(--lw,1)*5px);stroke-linejoin:round;stroke-linecap:round}
svg .ol2{stroke:var(--ink);stroke-width:calc(var(--lw,1)*3.2px);stroke-linejoin:round;stroke-linecap:round}
.prop{opacity:0;transition:opacity .5s;pointer-events:none}
svg[data-s=oeuf] .p-oeuf,svg[data-s=bebe] .p-bebe,svg[data-s=ado] .p-ado,svg[data-s=adulte] .p-adulte,svg[data-s=titan] .p-titan{opacity:1}
.breath{animation:breath 2.6s ease-in-out infinite;transform-origin:0 0}
@keyframes breath{50%{transform:scale(1.012,.978)}}
.nod{animation:nod 2.6s ease-in-out infinite;transform-origin:-30px 20px}
@keyframes nod{50%{transform:rotate(2deg)}}
.lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink 4.2s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%,97%{transform:scaleY(1)}}
.wob{animation:wob 1.4s ease-in-out infinite;transform-origin:0 -10px}
@keyframes wob{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-5deg)}80%{transform:rotate(5deg)}90%{transform:rotate(-3deg)}}
.popin{animation:popin .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes popin{0%{transform:scale(.6)}100%{transform:scale(1)}}
.drift{animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(70px)}}
.rays{animation:spin 60s linear infinite;transform-origin:842px 112px}
@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px)}}
.rot{animation:rot .16s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes rot{50%{transform:scaleX(.35)}}
.run{animation:run .45s ease-in-out infinite}
@keyframes run{50%{transform:translateY(-2.5px)}}
.wv{animation:wv 3s ease-in-out infinite alternate}
@keyframes wv{to{transform:translateX(10px)}}
.smk{animation:smk 3.5s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes smk{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:.85}100%{transform:translateY(-70px) scale(1.5);opacity:0}}
.flm{animation:flm .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flm{to{transform:scale(1.12,.86)}}
.flut{animation:flut .3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes flut{to{transform:scaleX(.45)}}
.fly{animation:fly 5s ease-in-out infinite alternate}
@keyframes fly{0%{transform:translate(0,0)}50%{transform:translate(24px,-22px)}100%{transform:translate(-14px,10px)}}
.beam{animation:beam .12s linear infinite alternate}
@keyframes beam{to{opacity:.8}}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.12)}}
.wig{animation:wig 1.8s ease-in-out infinite alternate;transform-origin:0 0}
@keyframes wig{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
/* jeu */
svg[data-s=titan] [data-b]{cursor:pointer}
.mg{position:absolute;left:0;right:0;top:0;z-index:5;touch-action:none;user-select:none;-webkit-user-select:none;cursor:ew-resize}
.mg[hidden]{display:none}
.mg>svg{display:block;width:100%;height:100%}
.mgskip{position:absolute;right:14px;bottom:12px;font-size:16px;padding:4px 18px}
.st{position:absolute;inset:0;z-index:5;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.st[hidden]{display:none}
#st-skip{bottom:96px}
.stp{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(70%,560px);background:var(--cream);border:4px solid var(--ink);border-radius:22px;padding:8px 14px 12px;box-shadow:0 5px 0 var(--ink)}
.stpips{display:flex;justify-content:center;gap:10px;margin-bottom:6px}
.stpips i{width:18px;height:18px;border-radius:50%;border:3px solid var(--ink);background:#fff}
.stpips i.crit{background:#ffd23f}.stpips i.ok{background:#5ed36a}.stpips i.miss{background:#9a94b3}
.stbar{position:relative;height:34px;border:4px solid var(--ink);border-radius:20px;background:#ff8a7a;overflow:hidden}
.stbar i{position:absolute;top:0;bottom:0}
.sty{background:#ffd23f}.stg{background:#5ed36a;border-left:3px solid var(--ink);border-right:3px solid var(--ink)}
.stc{position:absolute;top:0;bottom:0;width:10px;margin-left:-5px;background:#fff;border:3px solid var(--ink);border-radius:5px}
.mgact.chomp{animation:chomp .35s ease-in-out}
.mgact.no{animation:no .35s ease-in-out}
.capm{display:inline-block;vertical-align:middle;margin-right:6px}
.capm[hidden]{display:none}
.capm svg{width:22px;height:22px;display:block}
.app.home #game,.app.home .top .chip{display:none}
.app:not(.home) #home{display:none}
#home .card .n{font-size:24px}
.chip.mini{font:inherit;font-weight:800;font-size:14px;color:inherit;cursor:pointer;background:#ffe9b0}
.chip.mini:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.food{font:inherit;color:inherit;text-align:left;cursor:pointer}
.food:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tray.off .food{filter:saturate(.25) brightness(.9)}
.btn.locked{cursor:default}
.card.album{cursor:default}
.card.album:hover{transform:none;box-shadow:0 6px 0 var(--ink)}
.card.album.on,.card.album.on:hover{transform:translateY(-8px);box-shadow:0 14px 0 var(--ink)}
.card.lock .sil{filter:brightness(0);opacity:.3}
#night{transition:opacity 1s;pointer-events:none}
#fx{pointer-events:none}
.sleep #night{opacity:.5}
.sleep .lid{animation:none;transform:scaleY(1)}
.sleep .nod,.sleep .breath{animation-duration:5s}
.sleep .beam{display:none}
#act.jump{animation:jump .75s ease-out}
@keyframes jump{0%,55%,100%{transform:translateY(0)}28%{transform:translateY(-70px)}78%{transform:translateY(-24px)}}
#act.chomp{animation:chomp .45s ease-in-out}
@keyframes chomp{0%,100%{transform:scale(1)}30%{transform:scale(1.07,.92)}65%{transform:scale(.95,1.06)}}
#act.no{animation:no .45s ease-in-out}
@keyframes no{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-14px)}40%,80%{transform:translateX(14px)}}
.screen.shake{animation:shake .5s linear}
@keyframes shake{0%,100%{transform:translate(0)}15%{transform:translate(-8px,5px)}30%{transform:translate(7px,-6px)}45%{transform:translate(-6px,-4px)}60%{transform:translate(6px,5px)}80%{transform:translate(-3px,2px)}}
@media(prefers-reduced-motion:reduce){.screen.shake,#act.jump,#act.chomp,#act.no{animation:none}}
</style>
</head>
<body>
<div class="app home" id="app">
  <div class="top">
    <div class="logo">KAIJUCHI</div>
    <div class="chip stage" id="c-stage"></div>
    <div class="sp"></div>
    <div class="chip" id="c-day"></div>
    <div class="chip" id="c-w"></div>
    <div class="chip" id="c-d"></div>
    <button class="chip mini" id="b-new">Nouvelle partie</button>
  </div>
  <div id="home">
    <h2>Choisis ton monstre <small>il sortira de son œuf et grandira avec toi</small></h2>
    <div class="stages" id="species"></div>
  </div>
  <div id="game">
    <div class="screen" id="screen">
      <div class="gauges" id="gauges"></div>
      <svg id="scene" viewBox="0 0 1000 600" data-s="oeuf"></svg>
      <div class="mg" id="mg" hidden><svg id="mgs" viewBox="0 0 1000 600"></svg><button class="chip mini mgskip" id="mg-skip" type="button">Passer</button></div>
      <div class="st" id="st" hidden><div class="stp"><div class="stpips" id="st-p"></div><div class="stbar"><i class="sty" id="st-y"></i><i class="stg" id="st-g"></i><b class="stc" id="st-c"></b></div></div><button class="chip mini mgskip" id="st-skip" type="button">Passer</button></div>
    </div>
    <div class="row">
      <div class="evo"><div class="t"><span>Évolution</span><span><span class="capm" id="e-cap" hidden title="Assez joué pour aujourd'hui : plus de points avant demain"></span><span id="e-next"></span></span></div><div class="bar"><i id="e-bar" style="width:0%"></i></div></div>
      <div class="tray" id="tray"></div>
    </div>
    <div class="actions" id="actions"></div>
    <h2>Son évolution <small>les stades à venir restent cachés</small></h2>
    <div class="stages" id="stages"></div>
  </div>
</div>
<script>
const L='#2a2140';
function mb(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const f=n=>(+n).toFixed(1),f2=n=>(+n).toFixed(2),IV='#fff8e1';
function star(cx,cy,R,r,n){let s='';for(let i=0;i<n*2;i++){const a=Math.PI*i/n-Math.PI/2,q=i%2?r:R;s+=f(cx+Math.cos(a)*q)+','+f(cy+Math.sin(a)*q)+' '}return s}

/* ---------- stades ---------- */
const ST={
 oeuf:{n:'Œuf',z:5,m:.8,next:'vers Bébé',evo:35,day:'0',w:'2 kg',dmg:'aucun',age:'Jour 0',col:'#ffd166',cb:'radial-gradient(circle at 50% 35%,#fff7d6,#ffd98a)',vb:'-150 -235 300 265',
  menu:[['flame','Chaleur','éclosion'],['heart','Câlins','+ humeur']],short:'Chaleur et câlins',bub:[660,300,'heart'],pop:[340,330,'TOC TOC']},
 bebe:{n:'Bébé',z:4,m:.78,next:'vers Ado',evo:48,day:'2',w:'12 kg',dmg:'1 pot de fleurs',age:'Jours 1 à 3',col:'#b6f06a',cb:'radial-gradient(circle at 50% 35%,#f1ffd0,#b9ec7a)',vb:'-190 -296 370 328',
  bs:.55,hs:.95,ss:.5,es:1.28,brow:-10,pup:.62,teeth:1,cheek:1,hat:1,
  menu:[['butterfly','Papillon','+5 faim'],['apple','Pomme','+10 faim'],['fish','Poisson','+15 faim'],['ladybug','Coccinelle','+4 faim']],short:'Insectes, fruits, poissons',bub:[650,255,'apple'],pop:[330,310,'MIAM !']},
 ado:{n:'Ado',z:2,m:.86,next:'vers Adulte',evo:64,day:'12',w:'900 kg',dmg:'3 voitures',age:'Jours 4 à 14',col:'#5fe0a2',cb:'radial-gradient(circle at 50% 35%,#dcfff0,#84e6bd)',vb:'-250 -342 460 376',
  bs:.78,hs:.96,ss:.75,es:1.1,brow:2,pup:.54,teeth:2,cheek:1,
  menu:[['cow','Vache','+30 faim'],['tree','Arbre','+20 faim'],['car','Voiture','+45 faim'],['lamp','Lampadaire','+12 faim']],short:'Vaches, arbres, voitures',bub:[690,190,'car'],pop:[300,235,'SCRONCH !']},
 adulte:{n:'Adulte',z:1,m:.92,next:'vers Titan',evo:30,day:'31',w:'60 tonnes',dmg:'2 quartiers',age:'Jours 15 à 40',col:'#58d0c3',cb:'radial-gradient(circle at 50% 35%,#dff7ff,#8fd3f0)',vb:'-300 -410 540 436',
  bs:1,hs:1,ss:1,es:1,brow:12,pup:.46,teeth:3,hold:1,
  menu:[['boat','Bateau','+120 faim'],['heli','Hélicoptère','+90 faim'],['crowd','Foule ×10','+60 faim'],['bus','Bus','+150 faim']],short:'Bateaux, hélicos, foules',bub:[285,160,'boat'],pop:[770,300,'CROUNCH !']},
 titan:{n:'Titan',z:.5,m:1,next:'stade final',evo:100,day:'58',w:'20 000 tonnes',dmg:'4 villes',age:'Jour 41 et plus',col:'#b59cff',cb:'radial-gradient(circle at 50% 35%,#ffe3f3,#ffa9c9)',vb:'-345 -452 610 492',
  bs:1.15,hs:.96,ss:1.35,es:.92,brow:20,slit:1,teeth:4,glow:1,scar:1,beam:1,
  menu:[['building','Immeuble','+800 faim'],['cargo','Cargo','+600 faim'],['district','Quartier','+2 500 faim']],short:'Immeubles, quartiers, villes',bub:null,pop:[250,140,'GRAOUUU !']}
};
const ORDER=['oeuf','bebe','ado','adulte','titan'];

/* ---------- petits objets ---------- */
function car(x,y,col,dir=1,sc=1){return `<g transform="translate(${x},${y}) scale(${dir*sc},${sc})">
<ellipse cx="0" cy="1" rx="38" ry="4" fill="${L}" opacity=".22"/>
<path class="o" d="M-35 -9 C-35 -18,-29 -20,-21 -21 L-13 -32 C-11 -35,-7 -36,-1 -36 L12 -36 C18 -36,22 -33,25 -29 L30 -20 C37 -19,37 -12,37 -7 L37 -4 L-35 -4 Z" fill="${col}"/>
<path d="M-33 -9 L36 -9 L36 -5 L-33 -5 Z" fill="${L}" opacity=".18"/>
<path class="o2" d="M-10 -22 L-5 -31 L4 -31 L4 -22 Z" fill="#d4f2ff"/><path class="o2" d="M8 -22 L8 -31 L13 -31 C16 -31,19 -28,22 -22 Z" fill="#d4f2ff"/>
<path d="M-18 -18 L24 -18" stroke="#fff" stroke-width="1.6" opacity=".55"/>
<rect class="o2" x="31" y="-16" width="5" height="5" rx="2" fill="#fff2a0"/><rect class="o2" x="-35" y="-16" width="4" height="5" rx="1.5" fill="#ff4f5e"/>
<circle class="o2" cx="-18" cy="-4" r="7.5" fill="#3a3152"/><circle cx="-18" cy="-4" r="3" fill="#cfd6e6"/>
<circle class="o2" cx="20" cy="-4" r="7.5" fill="#3a3152"/><circle cx="20" cy="-4" r="3" fill="#cfd6e6"/></g>`}
function bus(x,y,col,dir=1){let w='';for(let i=0;i<5;i++)w+=`<rect class="o2" x="${-42+i*17}" y="-36" width="13" height="13" rx="2" fill="#d4f2ff"/>`;
return `<g transform="translate(${x},${y}) scale(${dir},1)"><ellipse cx="0" cy="1" rx="54" ry="4" fill="${L}" opacity=".22"/>
<rect class="o" x="-50" y="-44" width="100" height="40" rx="8" fill="${col}"/><rect x="-49" y="-20" width="98" height="6" fill="#fff" opacity=".85"/>${w}

 if(a[1]>=45)return '';const fo=FOODS[S.stage];return a[0]=='faim'?fo[S.want%fo.length][0]:a[0]}

 B.innerHTML=`<g transform="translate(${x},${y})"><g class="bob" style="animation-duration:2.4s"><circle cx="-52" cy="58" r="6" fill="#fff" stroke="${L}" stroke-width="3"/><circle cx="-38" cy="44" r="10" fill="#fff" stroke="${L}" stroke-width="3"/><ellipse cx="0" cy="0" rx="56" ry="46" fill="#fff" stroke="${L}" stroke-width="3.5"/><ellipse cx="-20" cy="-26" rx="16" ry="6" fill="#e9f6ff"/><svg x="${-v[2]*k/2}" y="${-v[3]*k/2}" width="${v[2]*k}" height="${v[3]*k}" viewBox="${IC[n][0]}">${IC[n][1]}</svg></g></g>`}

 GA.forEach(g=>{const v=isEgg?100:S[g[0]],e=$('g-'+g[0]);e.querySelector('.fill').style.width=v.toFixed(0)+'%';e.querySelector('.pc').textContent=isEgg?'':v.toFixed(0)+' %';e.classList.toggle('low',v<25)});

 $('e-next').textContent=NEED[k]&&S.xp>=NEED[k]&&ageLeft()>0?fmtLeft(ageLeft()):p.next;$('e-cap').hidden=!capped();$('e-bar').style.width=(NEED[k]?Math.min(100,100*S.xp/NEED[k]):100)+'%';

 P.innerHTML=`<g transform="translate(${x},${y}) rotate(-9)"><g class="popin"><polygon points="${star(0,0,96,62,13)}" fill="#ffe14d" stroke="${L}" stroke-width="4" stroke-linejoin="round"/><polygon points="${star(0,0,80,54,13)}" fill="#fff6b0"/><text x="0" y="11" text-anchor="middle" font-size="${t.length>8?27:31}" font-weight="800" fill="#ff4f5e" stroke="${L}" stroke-width="5" paint-order="stroke" stroke-linejoin="round">${t}</text></g></g>`;
 popT=setTimeout(()=>P.innerHTML='',1100)}
function react(c){const a=$('act');if(!a)return;a.setAttribute('class','');a.getBoundingClientRect();a.setAttribute('class',c)}
function fx(html,frames,ms){const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.innerHTML=html;$('fx').appendChild(g);
 const end=()=>g.remove(),an=g.animate?g.animate(frames,{duration:ms,easing:'ease-in',fill:'forwards'}):null;if(an)an.onfinish=end;setTimeout(end,ms+80)}
function fly(n,sx,sy){const v=IC[n][0].split(' ').map(Number),k=90/Math.max(v[2],v[3]),[mx,my]=mouth();
 const ax=sx==null?mx+330:sx,ay=sy==null?my+170:sy,bx=sx==null?mx+150:mx+(ax-mx)*.4,by=sx==null?my-40:my+(ay-my)*.4-50; // départ : hors champ, ou la position de la proie cliquée
 fx(`<svg x="${-v[2]*k/2}" y="${-v[3]*k/2}" width="${v[2]*k}" height="${v[3]*k}" viewBox="${IC[n][0]}" style="--k:1.4">${IC[n][1]}</svg>`,
  [{transform:`translate(${f(ax)}px,${f(ay)}px) scale(1)`},{transform:`translate(${f(bx)}px,${f(by)}px) scale(.9)`,offset:.55},{transform:`translate(${f(mx)}px,${f(my)}px) scale(.25)`}],480)}
function bubbles(){const p=ST[S.stage],h=p.m*p.bs*300,w=p.m*p.bs*170;for(let i=0;i<14;i++){const x=500+(Math.random()*2-1)*w,y=470-Math.random()*h,r=8+Math.random()*14;
 fx(`<circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}" fill="#fff" opacity=".65" stroke="#9fe0ff" stroke-width="3"/><circle cx="${f(x-r*.3)}" cy="${f(y-r*.3)}" r="${f(r*.25)}" fill="#fff"/>`,
  [{transform:'translateY(20px)',opacity:0},{transform:'translateY(0)',opacity:1,offset:.25},{transform:'translateY(-90px)',opacity:0}],700+Math.random()*600)}}
function boom(x,y){if(x==null){x=600+Math.random()*320;y=300+Math.random()*130}
 fx(`<g transform="translate(${f(x)},${f(y)})"><polygon points="${star(0,0,70,34,11)}" fill="#fff" stroke="${L}" stroke-width="3"/><polygon points="${star(0,0,50,22,11)}" fill="#ffd23f"/><polygon points="${star(0,0,30,13,11)}" fill="#ff7a2e"/></g>`,
  [{opacity:1},{opacity:1,offset:.7},{opacity:0}],650);
 const sc=$('screen');sc.classList.remove('shake');sc.getBoundingClientRect();sc.classList.add('shake')}
function flash(){fx(`<rect width="1000" height="600" fill="#fff"/>`,[{opacity:1},{opacity:0}],700)}

/* actions */
const busy=()=>Date.now()<lockT||(lockT=Date.now()+420,false);
function evolve(){const k=S.stage,n=NEED[k];if(!ready())return false;S.xp-=n;S.stage=ORDER[idx()+1];S.want=0;S.since=Date.now();cityAdvance();
 if(k=='oeuf')Object.assign(S,{faim:60,humeur:80,energie:80,propre:100});else S.humeur=clamp(S.humeur+20);
 drawAll();flash();pop(k=='oeuf'?'CRAC !':'GRAOU !');return true}
function done(){if(!evolve())hud();save()}
function refuse(t){pop(t);react('no');strike('debout','colere',700)}
function feed(i,src){const k=S.stage,fo=FOODS[k];if(mini||busy())return false;
 if(k=='oeuf'){gain(fo[i][3]);if(i)S.humeur=clamp(S.humeur+3);react('chomp');pop(i?'SMACK !':'TOC TOC');done();return true}
 if(S.asleep){pop('ZZZ…');return false}
 if(i==null){const w=need();i=fo.findIndex(m=>m[0]==w);if(i<0)i=Math.floor(Math.random()*fo.length)}
 if(S.faim>=96){refuse('BEURK !');return false}
 const m=fo[i],wanted=need()==m[0];fly(m[0],src&&src[0],src&&src[1]);
 setTimeout(()=>{if(!S||S.stage!=k)return;S.faim=clamp(S.faim+m[2]);gain(m[3]);S.propre=clamp(S.propre-3);if(wanted){S.humeur=clamp(S.humeur+6);S.want++}
  react('chomp');strike('mange','miam',700);pop(rnd(MIAM[k]));done()},430);return true}
function play(){if(mini||busy())return;if(S.asleep)return pop('ZZZ…');if(S.energie<10)return refuse('PFFF…');startCatch()}
function sleep(){if(busy())return;S.asleep=!S.asleep;if(!S.asleep)pop('OUAAAH !');done()}
function wash(){if(busy())return;if(S.asleep)return pop('ZZZ…');S.propre=clamp(S.propre+40);bubbles();react('chomp');pop(rnd(['SPLASH !','PLOUF !','FROTT !']));done()}
const HIT={ado:1,adulte:3,titan:8}; // dégâts par coup
function destroy(){if(idx()<2||mini||busy())return;if(S.asleep)return pop('ZZZ…');if(S.energie<15)return refuse('PFFF…');
 if(!nearest())return refuse('HMPF…'); // rien à détruire : la ville est rasée, la suivante attend un stade plus grand
 startStrike()}
const DO={feed:()=>feed(null),play,sleep,wash,destroy};

/* ---------- la ville destructible : état, dégâts, niveaux ---------- */
const cityList=()=>cityDefs(S.city.niveau);
const pvNow=B=>pvOf(B,S.city.pv);
const standing=()=>cityList().filter(B=>pvNow(B)>0);
const ruined=()=>cityList().length-standing().length;
// l'immeuble debout le plus proche du monstre (qui se tient en x = 0)
function nearest(){let best=null,bd=1e9;cityList().forEach(B=>{if(pvNow(B)<=0)return;const d=Math.abs(B.x+B.w/2);if(d<bd){bd=d;best=B}});return best}
// la ville entière est redessinée seulement quand le niveau change ; un immeuble se redessine seul dans son <g data-b>
function buildWorld(){const [b,fg]=world(S.city.niveau,S.city.pv);W.innerHTML=b;WF.innerHTML=fg}
function redrawB(B){const g=W.querySelector(`[data-b="${B.id}"]`);if(g)g.innerHTML=bldSvg(B,pvNow(B))}
// position de l'immeuble à l'écran (repère 1000 x 600), pour placer l'éclat
function bScreen(B){const z=zCur||1;return [Math.max(70,Math.min(930,500+z*(B.x+B.w/2))),Math.max(70,Math.min(530,470+z*(-46-B.h/2)))]}
// enlève des points de vie ; renvoie vrai si l'immeuble tombe en ruine
function hitB(B,dmg){S.city.pv[B.id]=Math.max(0,pvNow(B)-dmg);redrawB(B);
 if(S.city.pv[B.id]>0)return false;S.dmg++;gain(8+B.pvMax*5);return true}
// un coup sur l'immeuble le plus proche ; gère l'éclat, le mot et la fin de ville
function strikeCity(dmg,word){const B=nearest();if(!B)return null;const [x,y]=bScreen(B),dead=hitB(B,dmg);boom(x,y);
 pop(word||(dead?rnd(['BOUM !','CRAAAC !']):'CRAC !'));if(dead&&!standing().length)cityCleared();return {B,dead}}
function cityCleared(){const l=S.city.niveau;gain(40+20*l);S.humeur=clamp(S.humeur+25);pop('BADABOUM !');flash();cityAdvance()}
// passe à la ville suivante quand tout est rasé et que le stade du monstre le permet
function cityAdvance(){if(standing().length)return false;const n=S.city.niveau+1;if(idx()<lvInfo(n).st)return false;
 S.city={niveau:n,pv:{}};buildWorld();return true}
/* ---------- proies mobiles cliquables dans le décor ---------- */
// Objets {type,x,y,dir,v}, déplacés par requestAnimationFrame dans le groupe #prey (attribut transform, jamais de CSS).
// f = nom de la proie dans FOODS (null : simple passant), r = rayon de clic, cy = hauteur du centre, v = vitesse en pixels d'écran par seconde,
// m = mode (wrap : traverse puis réapparaît de l'autre côté, bounce : fait demi-tour, leap : saute en arc), art = sens du dessin (1 = regarde à droite)
const CARC=['#4db8ff','#ffd23f','#b58cff','#5ed36a','#ff8fc0','#ff9a3c','#ff5a5a','#ffffff'],ri=n=>Math.floor(Math.random()*n);
const crowdSp=()=>`<g class="run">`+person(-12,0,ri(8),1)+person(12,0,ri(8),1)+person(0,2,ri(8),1)+`</g>`;
const MV={
 butterfly:{f:'butterfly',r:26,cy:0,v:42,m:'wrap',art:1,y:()=>-85+Math.random()*60,sp:()=>butterfly(0,0,rnd(['#ff8fc0','#7cc8ff','#ffd23f']),rnd(['#ffd23f','#b58cff','#ff9a3c']),1.15)},
 ladybug:{f:'ladybug',r:24,cy:-11,v:7,m:'bounce',art:1,y:()=>6+Math.random()*18,sp:()=>ladybug(0,0,1.3)},
 apple:{f:'apple',r:24,cy:-19,v:11,m:'bounce',art:1,spin:1,y:()=>8+Math.random()*18,sp:()=>apple(0,0,1.3)},
 fish:{f:'fish',r:32,cy:0,m:'leap',art:1,sp:()=>fish(0,0,1.4)},
 cow:{f:'cow',r:46,cy:-26,v:9,m:'bounce',art:-1,y:()=>-2+Math.random()*12,sp:()=>cow(0,0,1,1)},
 car:{f:'car',r:42,cy:-18,v:68,m:'wrap',art:1,lane:()=>rnd([[-29,-1],[-15,1]]),sp:()=>car(0,0,rnd(CARC),1,1)},
 bus:{f:'bus',r:56,cy:-22,v:52,m:'wrap',art:1,lane:()=>rnd([[-29,-1],[-15,1]]),sp:()=>bus(0,0,rnd(CARC),1)},
 walker:{f:null,r:14,cy:-10,v:22,m:'wrap',art:1,lane:()=>[-41,rnd([-1,1])],sp:()=>`<g class="run">`+person(0,0,ri(8),1,.9)+`</g>`},
 crowd:{f:'crowd',r:28,cy:-12,v:20,m:'wrap',art:1,lane:()=>[-41,rnd([-1,1])],sc:()=>1.15,sp:crowdSp},
 boat:{f:'boat',r:50,cy:-40,v:18,m:'bounce',art:1,lane:()=>{const y=rnd([-20,40,100,160,220]);return [y,rnd([-1,1])]},sc:o=>1+(o.y+20)/700,
  bounds:hw=>[Math.max(-1050,-hw-170),-390],sp:()=>sail(0,0,1,rnd(['#ff8fc0','#5ed36a','#ffd23f','#b58cff','#ff9a3c']))},
 heli:{f:'heli',r:70,cy:-14,v:55,m:'wrap',art:-1,y:()=>-420+Math.random()*150,sc:()=>1+Math.random()*.5,sp:()=>heli(0,0,1,rnd(['#ff9320','#4db8ff','#ff5a8a']),Math.random()*2)},
 cargo:{f:'cargo',r:150,cy:-60,v:9,m:'bounce',art:1,lane:()=>rnd([[-34,1],[-40,1]]),sc:o=>o.y==-40?.7:1,bounds:hw=>[-1050,-480],sp:()=>cargo(0,0,1,ri(20))},
 district:{f:'district',r:100,cy:-55,v:7,m:'bounce',art:1,y:()=>-30,bounds:hw=>[-980,-500],
  sp:()=>`<path class="o" d="M-104 -10 L104 -10 L86 8 L-86 8 Z" fill="#8a84a3"/><g transform="translate(-88,-8)">${IC.district[1]}</g>`}
};
// population par stade : [type, nombre] (douze objets mobiles au plus)
const POP={bebe:[['butterfly',3],['ladybug',2],['apple',2],['fish',1]],ado:[['cow',2],['car',3],['bus',1],['walker',2]],
 adulte:[['boat',2],['heli',2],['crowd',2],['bus',2],['car',3]],titan:[['cargo',2],['district',1],['car',3],['bus',1],['boat',2],['heli',1]]};
const MAXMV=12,EDGE=170;
let PR=[],preyStage=null,preyRaf=0,preyT=0,pid=0;

function spawn(type,edge){if(PR.filter(o=>!o.gone).length>=MAXMV)return null;
 const M=MV[type],z=ST[preyStage].z,hw=500/z,o={id:++pid,type,f:M.f,tm:Math.random()*9,ph:Math.random()*6.28,rot:0,gone:false};
 let ln=M.lane?M.lane():[M.y?M.y():0,rnd([-1,1])];o.y=ln[0];o.dir=ln[1];o.sc=M.sc?M.sc(o):1;o.cy=M.cy*o.sc;o.r=M.r*o.sc;o.y0=o.y;o.v=(M.v||0)/z;
 o.live=!!M.f&&FOODS[preyStage].some(m=>m[0]==M.f); // seules les proies du stade sont cliquables
 const hit=Math.max(o.r,23/z); // zone de clic : au moins 44 px à l'écran, quel que soit le zoom
 if(M.m=='wrap'){const lim=hw+EDGE+o.r;o.lim=lim;o.x=edge?-o.dir*lim:(Math.random()*2-1)*hw}
 else if(M.m=='bounce'){const b=M.bounds?M.bounds(hw):[-hw+25,hw-25];o.lo=b[0];o.hi=b[1];o.x=edge?(o.dir>0?o.lo:o.hi):o.lo+Math.random()*(o.hi-o.lo)}
 else{o.u=Math.random();o.dur=1.6;o.wait=0;leapNew(o,hw)}
 const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class','mv');g.dataset.id=o.id;g.style.pointerEvents='none';
 g.innerHTML=(o.live?`<circle class="halo pulse" cx="0" cy="${f(o.cy)}" r="${f(Math.max(o.r*.9,19/z))}" fill="#fff6a0" fill-opacity=".4" stroke="#fff" style="stroke-width:calc(var(--k)*2.4px)"/>`:'')+`<g class="fl">${M.sp()}</g>`+(o.live?`<circle cx="0" cy="${f(o.cy)}" r="${f(hit)}" fill="#000" fill-opacity="0" style="pointer-events:all;cursor:pointer"/>`:'');
 o.el=g;o.fl=g.querySelector('.fl');o.flKey='';PB.appendChild(g);PR.push(o);place(o);return o}
function leapNew(o,hw){o.u=0;o.xa=(Math.random()*2-1)*(hw-40);o.dir=Math.random()<.5?-1:1;o.xb=o.xa+o.dir*(60+Math.random()*50);o.H=95;o.x=o.xa;o.y=42}
function place(o){const M=MV[o.type];let a=o.rot,k=o.dir*M.art*o.sc+'|'+o.sc+'|'+a.toFixed(0);
 o.el.setAttribute('transform',`translate(${o.x.toFixed(1)},${o.y.toFixed(1)})`);
 if(k!=o.flKey){o.flKey=k;o.fl.setAttribute('transform',`scale(${o.dir*M.art*o.sc},${o.sc})`+(a?` rotate(${a.toFixed(1)} 0 ${(M.cy).toFixed(1)})`:''))}}
function stepMover(o,dt,hw){const M=MV[o.type];o.tm+=dt;
 if(M.m=='wrap'){o.x+=o.dir*o.v*dt;if(o.dir>0?o.x>o.lim:o.x<-o.lim)o.x=-o.dir*o.lim;if(M.f=='butterfly')o.y=o.y0+Math.sin(o.tm*2.2+o.ph)*12}
 else if(M.m=='bounce'){o.x+=o.dir*o.v*dt;if(o.x>o.hi){o.x=o.hi;o.dir=-1}else if(o.x<o.lo){o.x=o.lo;o.dir=1}if(M.spin)o.rot=(o.rot+o.v*dt*3.2)%360}
 else{if(o.wait>0){o.wait-=dt;o.el.style.display='none';if(o.wait<=0){leapNew(o,hw);o.el.style.display=''}return}
  o.u+=dt/o.dur;if(o.u>=1){o.wait=.8+Math.random()*1.6;o.u=1}
  const u=o.u;o.x=o.xa+(o.xb-o.xa)*u;o.y=42-4*o.H*u*(1-u);const vy=-4*o.H*(1-2*u)/o.dur,vx=Math.abs(o.xb-o.xa)/o.dur;o.rot=Math.atan2(vy,vx)*57.3}
 place(o)}
function preyTick(t){preyRaf=requestAnimationFrame(preyTick);const dt=Math.min(.05,Math.max(0,(t-preyT)/1000));preyT=t;
 if(!preyStage)return;const hw=500/ST[preyStage].z;for(const o of PR)if(!o.gone)stepMover(o,dt,hw)}
function preyRun(on){cancelAnimationFrame(preyRaf);preyRaf=0;if(on&&!document.hidden){preyT=performance.now();preyRaf=requestAnimationFrame(preyTick)}}
function stopPrey(){preyRun(false);PR=[];preyStage=null;PB.innerHTML=''}
// (re)crée les objets mobiles du stade courant ; sans effet si le stade n'a pas changé
function syncPrey(force){if(!S||S.stage=='oeuf'){if(preyStage)stopPrey();return}
 if(!force&&preyStage==S.stage&&PR.length)return;stopPrey();preyStage=S.stage;PB.innerHTML='';
 (POP[S.stage]||[]).forEach(([t,n])=>{for(let i=0;i<n;i++)spawn(t,false)});preyRun(true)}
// une proie mangée disparaît puis réapparaît au bord quelques secondes plus tard
function eatMover(o){o.gone=true;o.el.remove();const st=preyStage,type=o.type;
 PR=PR.filter(p=>p!==o);setTimeout(()=>{if(S&&preyStage==st)spawn(type,true)},3000+Math.random()*3000)}
PB.addEventListener('pointerdown',e=>{const g=e.target.closest('.mv');if(!g||!S||S.stage=='oeuf'||mini)return;
 const o=PR.find(p=>p.id==g.dataset.id);if(!o||!o.live)return;e.preventDefault();
 const i=FOODS[S.stage].findIndex(m=>m[0]==o.f);if(i<0)return;
 const z=zCur||1,sx=500+z*o.x,sy=470+z*(o.y+o.cy);if(feed(i,[sx,sy]))eatMover(o)});
// au stade titan, les immeubles encore debout se mangent aussi d'un clic (proie « Immeuble »)
W.addEventListener('pointerdown',e=>{if(!S||S.stage!='titan'||mini)return;const g=e.target.closest('[data-b]');if(!g)return;
 const B=cityList().find(b=>b.id==g.dataset.b);if(!B||pvNow(B)<=0)return;const [sx,sy]=bScreen(B);
 if(feed(0,[sx,sy])){hitB(B,1e9);boom(sx,sy);if(!standing().length)cityCleared()}});

const FOE={

function startWave(){if(RP.on||!rpOk())return false;const N=S.stage=='titan'?6:4,kinds=['tank','heli','plane','tank','heli','plane'];
 Object.assign(RP,{on:true,t:0,list:[],q:[],eaten:0,total:N,last:performance.now(),stage:S.stage,n:RP.n+1});
 for(let i=0;i<N;i++)RP.q.push({t:i*2.2+Math.random(),type:kinds[i],side:i%2?1:-1});
 pop('WIOUUU !');cancelAnimationFrame(RP.raf);RP.raf=requestAnimationFrame(rpTick);return true}
function foeSpawn(q){const z=ST[RP.stage].z,hw=500/z,F=FOE[q.type],sc=Math.max(1,.7/z),th=rpTall(),side=q.side;
 const o={type:q.type,side,sc,r:F.r*sc,cy:F.cy*sc,gone:false,stun:0,tf:1.6+Math.random()*2,hold:false,tm:Math.random()*9};
 o.lim=hw+170+o.r;o.x=side*o.lim;o.dir=-side;o.v=F.v/z;
 if(q.type=='tank'){o.y=-22;o.sx=side*210/z}else if(q.type=='heli'){o.y=-th*.85;o.sx=side*260/z}else{o.y=-th*1.1;o.sx=0}
 o.y0=o.y;
 const g=document.createElementNS('http://www.w3.org/2000/svg','g'),hit=Math.max(o.r,23/z);g.style.pointerEvents='none';
 g.innerHTML=`<circle class="halo pulse" cx="0" cy="${f(o.cy)}" r="${f(Math.max(o.r*.9,19/z))}" fill="#ff8a7a" fill-opacity=".35" stroke="#fff" style="stroke-width:calc(var(--k)*2.4px)"/><g class="fl">${F.sp()}</g><g class="stn" style="display:none" transform="translate(0,${f(o.cy-60*sc)}) scale(${sc})"><g class="bob">${STARS}</g></g><circle data-foe="1" cx="0" cy="${f(o.cy)}" r="${f(hit)}" fill="#000" fill-opacity="0" style="pointer-events:all;cursor:pointer"/>`;
 o.el=g;o.fl=g.querySelector('.fl');o.stn=g.querySelector('.stn');o.circ=g.querySelector('[data-foe]');o.circ.__o=o;FG.appendChild(g);RP.list.push(o);foePlace(o)}
function foePlace(o){o.el.setAttribute('transform',`translate(${o.x.toFixed(1)},${o.y.toFixed(1)})`);
 const s=`scale(${o.dir*FOE[o.type].art*o.sc},${o.sc})`;if(s!=o.sk){o.sk=s;o.fl.setAttribute('transform',s)}}
function foeStep(o,dt){o.tm+=dt;
 if(o.stun>0){o.stun-=dt;o.stn.style.display=o.stun>0?'':'none';if(o.stun>0)return}
 const F=FOE[o.type],dx=o.sx-o.x;
 if(o.type=='plane'){o.x+=o.dir*o.v*dt*1.6;if(Math.abs(o.x)>o.lim)o.dir=o.x>0?-1:1;o.y=o.y0+Math.sin(o.tm*2)*10;o.hold=true}
 else if(!o.hold){const st=o.v*dt;if(Math.abs(dx)<=st){o.x=o.sx;o.hold=true;o.dir=-o.side}else{o.dir=Math.sign(dx);o.x+=o.dir*st}}
 else if(o.type=='heli')o.y=o.y0+Math.sin(o.tm*2.4)*9;
 if(o.hold){o.tf-=dt;if(o.tf<=0){o.tf=5+Math.random()*2;foeFire(o)}}
 foePlace(o)}

function foeFire(o){const [tx,ty]=rpTarget(),sc=o.sc,g=document.createElementNS('http://www.w3.org/2000/svg','g');
 g.innerHTML=`<circle class="o2" r="${f(6*sc)}" fill="#ff5a3c"/><circle r="${f(2.4*sc)}" fill="#ffe14d"/>`;FG.appendChild(g);
 RP.shots.push({el:g,x0:o.x,y0:o.y+o.cy,tx,ty,u:0,sc})}
function foeHit(s){S.humeur=clamp(S.humeur-WAVE_HUM);if(!poseNow)strike('debout','triste',500);react('no');
 const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.innerHTML=`<g transform="translate(${f(s.tx)},${f(s.ty)}) scale(${f(s.sc)})"><polygon class="o2" points="${star(0,0,24,11,9)}" fill="#ffd23f"/><polygon points="${star(0,0,13,6,9)}" fill="#ff7a2e"/></g>`;
 FG.appendChild(g);setTimeout(()=>g.remove(),320)}
function rpTick(now){if(!RP.on)return;RP.raf=requestAnimationFrame(rpTick);const dt=Math.min(.05,(now-RP.last)/1000);RP.last=now;
 if(!S||S.asleep||S.stage!=RP.stage)return endWave('abort');
 if(mini)return; // un mini-jeu gèle la vague
 RP.t+=dt;while(RP.q.length&&RP.q[0].t<=RP.t)foeSpawn(RP.q.shift());
 RP.list.forEach(o=>foeStep(o,dt));
 RP.shots=RP.shots.filter(s=>{s.u+=dt/.75;if(s.u>=1){s.el.remove();foeHit(s);return false}
  s.el.setAttribute('transform',`translate(${f(s.x0+(s.tx-s.x0)*s.u)},${f(s.y0+(s.ty-s.y0)*s.u)})`);return true});
 if(RP.t>=WAVE_DUR)endWave('time')}

 RP.shots.forEach(s=>s.el.remove());RP.shots=[];
 RP.list.forEach(o=>{const e=o.el;if(how!='abort'&&e.animate){e.animate([{opacity:1},{opacity:0}],{duration:500}).onfinish=()=>e.remove();setTimeout(()=>e.remove(),600)}else e.remove()});RP.list=[];RP.q=[];

 if(how=='win'&&S){gain(30);S.humeur=clamp(S.humeur+10);pop('HOURRA !');react('jump');strike('debout','content',900);done()}
 else if(how=='time'&&S){pop('OUF !')}}

 o.el.remove();RP.list=RP.list.filter(p=>p!==o);RP.eaten++;fly(F.ic,sx,sy);
 setTimeout(()=>{if(!S)return;S.faim=clamp(S.faim+F.faim);gain(F.pts);react('chomp');strike('mange','miam',700);pop(rnd(MIAM[S.stage]||MIAM.adulte));done()},430);

const bolt=(x,y)=>{let d=`M${f(x+30)} -10`;for(let k=1;k<6;k++)d+=` L${f(x+30-k*30/6+(k%2?-26:26))} ${f(-10+(y+10)*k/6)}`;d+=` L${f(x)} ${f(y)}`;return `<path d="${d}" fill="none" stroke="${L}" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#fff6a0" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>`};
const PFX={
 swipe:(C,M,T)=>gone(pg(C[0]+110,C[1]-10,`<path d="M-70 70C-60 -50,40 -90,90 -60 20 -40,-20 10,-70 70Z" fill="#fff" stroke="${L}" stroke-width="6" stroke-linejoin="round"/>`),700),
 roar:(C,M)=>{shk();[0,.15,.3].forEach(d=>gone(pg(M[0]+40,M[1],`<circle r="60" fill="none" stroke="${L}" stroke-width="16"/><circle r="60" fill="none" stroke="#fff" stroke-width="8"/>`,d),1100))},
 atom:()=>{const s=$('scene');s.classList.add('pwr-beam');flash();shk();setTimeout(()=>s.classList.remove('pwr-beam'),1900)},
 roll:(C,M,T,P)=>{const a=$('act');if(a&&a.animate)a.animate([{transform:'translateX(0) scale(1)'},{transform:'translateX(150px) scale(.82,1.12)',offset:.4},{transform:'translateX(150px) scale(1)',offset:.55},{transform:'translateX(0) scale(1)'}],{duration:900,easing:'ease-in-out'});
  for(let i=0;i<4;i++)gone(pg(480+i*40,468,`<circle r="22" fill="#fff" stroke="${L}" stroke-width="4" opacity=".9"/>`,.1+i*.12),900)},
 hug:(C)=>{gone(pg(C[0]+160,C[1]-30,`<g transform="scale(3.4) translate(-24 -24)">${UI.heart}</g>`),900);[0,1,2,3].forEach(i=>gone(pg(C[0]+70+i*60,C[1]-110+(i%2)*70,`<g transform="scale(1.2) translate(-24 -24)">${UI.heart}</g>`,.15+i*.1),900))},
 burp:(C,M)=>{shk();for(let i=0;i<5;i++)gone(pg(M[0]+70+i*48,M[1]-10+(i%2)*26,`<circle r="34" fill="#9be35a" stroke="${L}" stroke-width="5"/><circle cx="-10" cy="-10" r="10" fill="#d4f59a"/>`,i*.09),1100)},
 spit:(C,M,T)=>T.forEach((t,i)=>proj(`<circle r="14" fill="#ff7a2e" stroke="${L}" stroke-width="4"/><circle r="6" fill="#ffe14d"/>`,M[0],M[1],t[0],t[1],480,i*130)),
 lava:(C,M,T)=>T.forEach((t,i)=>proj(`<circle r="18" fill="#ff5a3c" stroke="${L}" stroke-width="4"/><circle r="8" fill="#ffd23f"/>`,t[0]+30,-40,t[0],t[1],520,i*120,0)),
 erupt:(C,M,T)=>{shk();T.forEach((t,i)=>setTimeout(()=>{if(S)gone(`<g transform="translate(${f(t[0])},${f(t[1]+40)})"><g class="pup">${fire(0,0,2.6)}</g></g>`,850)},i*110))},
 jet:(C,M,T)=>T.forEach((t,i)=>proj(`<ellipse rx="22" ry="12" fill="#4db8ff" stroke="${L}" stroke-width="4"/><ellipse cx="-6" cy="-4" rx="7" ry="3.5" fill="#fff"/>`,M[0],M[1],t[0],t[1],480,i*130,40)),
 tide:()=>{
  fx(`<path d="M-1100 600V470C-1000 420,-940 455,-880 395C-840 345,-790 375,-760 430L-760 600Z" fill="#4db8ff" stroke="${L}" stroke-width="6" stroke-linejoin="round"/><path d="M-880 395C-840 345,-790 375,-760 430" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/>`,[{transform:'translateX(0)'},{transform:'translateX(1900px)'}],1300)},
 bolt:(C,M,T)=>{flash();T.forEach((t,i)=>setTimeout(()=>{if(S)gone(bolt(t[0],t[1]),400)},i*120))},
 quake:()=>{shk();let d='M0 520';for(let x=40;x<=1000;x+=60)d+=` L${x} ${520+((x/60)%2?18:-14)}`;gone(`<path d="${d}" fill="none" stroke="${L}" stroke-width="10" stroke-linejoin="round"/><path d="M200 520L240 600M520 520L470 600M780 520L830 600" fill="none" stroke="${L}" stroke-width="8"/>`,1100);
  for(let i=0;i<6;i++)gone(pg(100+i*160,500,`<circle r="20" fill="#e3c9a0" stroke="${L}" stroke-width="4"/>`,i*.05),900)}};

/* utilisation d'un pouvoir */
function usePower(i){if(!S||S.stage=='oeuf'||mini||busy())return;if(S.asleep)return pop('ZZZ…');
 if(!pwOpen(i)||pwLeft(i)>0)return refuse('PFFF…');
 const P=pwOf(i),T=standing().sort((a,b)=>Math.abs(a.x+a.w/2)-Math.abs(b.x+b.w/2)).slice(0,P[2]);
 if(!T.length&&!RP.on)return refuse('HMPF…'); // rien à détruire ni à repousser : on garde le pouvoir
 S.pw[i]=Date.now()+POWCD[i]*1000;
 const M=mouth(),pp=ST[S.stage],C=[500,470-pp.m*pp.bs*150],TS=T.map(bScreen),me=S;
 strike('frappe','colere',900);react('jump');PFX[P[1]](C,M,TS,P);pop(P[5]);
 if(RP.on)stunFoes(P[4]);
 // les dégâts tombent quand l'effet arrive
 setTimeout(()=>{if(S!==me)return;T.forEach(B=>{if(pvNow(B)>0){hitB(B,P[3]);const [x,y]=bScreen(B);boom(x,y)}});if(T.length&&!standing().length)cityCleared();done();pwHud()},P[1]=='tide'?650:P[1]=='roar'||P[1]=='atom'?350:480);
 pwHud();save()}
pwBox.addEventListener('click',e=>{const b=e.target.closest('.pw');if(b&&S)usePower(+b.dataset.i)});
/* démarrage */
function show(){$('app').classList.toggle('home',!S);if(S){CUR=D[S.mon];buildWorld();drawAll()}else stopPrey()}
function start(i){const now=Date.now();S={v:1,mon:i,stage:'oeuf',xp:0,faim:60,humeur:80,energie:80,propre:100,asleep:false,born:now,t:now,dmg:0,want:0,since:now,care:50,dayK:-1,dayXp:0,city:{niveau:1,pv:{}},best:{catch:0}};save();show();scrollTo(0,0)}
$('species').addEventListener('click',e=>{const c=e.target.closest('.card');if(c)start(+c.dataset.i)});
$('tray').addEventListener('click',e=>{const c=e.target.closest('.food');if(c&&S&&!mini)feed(+c.dataset.i)});
$('actions').addEventListener('click',e=>{const c=e.target.closest('.btn');if(c&&S&&S.stage!='oeuf'&&!mini)DO[c.dataset.a]()});
$('b-new').addEventListener('click',()=>{if(confirm('Recommencer avec un nouvel œuf ? Ton monstre actuel sera perdu.')){try{localStorage.removeItem(KEY)}catch(e){}S=null;show()}});
setInterval(()=>{if(!S)return;const now=Date.now();decay((now-S.t)/1000*DEBUG_SPEED);S.t=now;if(!evolve())hud();save()},1000);
S=load();if(S){const gap=Date.now()-S.t;decay(gap/4000*DEBUG_SPEED,true);S.t=Date.now();if(gap>=6e5)visite()} // page fermée : le temps compte quatre fois moins, jamais sous 15
show();
</script>
