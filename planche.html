<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaijuchi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a2140;--cream:#fff6dd;--k:1}
*{box-sizing:border-box}
body{margin:0;padding:24px 16px 56px;min-height:100vh;color:var(--ink);
  font-family:'Baloo 2','Fredoka','Trebuchet MS',system-ui,sans-serif;font-weight:600;
  background:radial-gradient(rgba(255,255,255,.16) 2px,transparent 2.6px) 0 0/28px 28px,linear-gradient(160deg,#5b54f0 0%,#a557f5 48%,#ff78b4 100%);background-attachment:fixed}
.app{max-width:1060px;margin:0 auto;background:var(--cream);border:4px solid var(--ink);border-radius:34px;padding:18px;
  box-shadow:0 10px 0 var(--ink),0 28px 50px rgba(30,10,80,.4)}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 4px 12px}
.logo{font-weight:800;font-size:38px;line-height:1;color:#ff7a3d;letter-spacing:.5px;margin-right:6px;
  text-shadow:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink),2px 2px var(--ink),-2px 2px var(--ink),2px -2px var(--ink),-2px -2px var(--ink),0 6px 0 var(--ink)}
.chip{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:1px 14px;font-weight:700;font-size:16px;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.chip b{font-weight:800}
.chip.stage{background:var(--sc,#ffd166);font-weight:800}
.sp{flex:1}
.screen{position:relative;border:4px solid var(--ink);border-radius:24px;overflow:hidden;background:#8fdcff;box-shadow:0 6px 0 var(--ink)}
.screen>svg{display:block;width:100%;height:auto}
.gauges{position:absolute;left:14px;right:14px;top:12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.gauge{display:flex;align-items:center}
.gauge .ic{width:42px;height:42px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:grid;place-items:center;flex:none;z-index:1;box-shadow:0 3px 0 var(--ink)}
.gauge .ic svg{width:28px;height:28px}
.gauge .trk{flex:1;height:24px;margin-left:-12px;background:rgba(42,33,64,.78);border:3px solid var(--ink);border-radius:0 14px 14px 0;overflow:hidden;position:relative;box-shadow:0 3px 0 var(--ink)}
.gauge .fill{height:100%;background:linear-gradient(var(--g1),var(--g2));border-radius:0 9px 9px 0;position:relative}
.gauge .fill::after{content:"";position:absolute;left:14px;right:5px;top:2px;height:5px;border-radius:4px;background:rgba(255,255,255,.6)}
.gauge .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 9px 0 18px;font-size:13px;font-weight:800;color:#fff;text-shadow:0 2px 0 var(--ink),1px 0 var(--ink),-1px 0 var(--ink)}
.gauge.low .fill{animation:low 1s infinite}
@keyframes low{50%{filter:brightness(1.5)}}
.row{display:flex;gap:14px;align-items:stretch;margin-top:16px;flex-wrap:wrap}
.evo{flex:1 1 100%;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px 14px 10px;box-shadow:0 4px 0 var(--ink)}
.evo .t{display:flex;justify-content:space-between;font-size:15px;font-weight:800}
.evo .bar{height:18px;border:3px solid var(--ink);border-radius:10px;background:#e9e2ff;overflow:hidden;margin-top:4px}
.evo .bar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,#9b6bff 0 12px,#b58cff 12px 24px);border-right:3px solid var(--ink);transition:width .6s}
.tray{flex:1 1 100%;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tray .tt{font-size:15px;font-weight:800;writing-mode:vertical-rl;transform:rotate(180deg);opacity:.7}
.food{flex:1 1 0;min-width:150px;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:5px 8px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 0 var(--ink)}
.food svg{width:50px;height:50px;flex:none;--k:1.5}
.food .n{font-size:15px;font-weight:800;line-height:1.05}
.food .v{font-size:13px;font-weight:700;color:#e2552c}
.actions{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:16px}
.btn{position:relative;border:4px solid var(--ink);border-radius:22px;background:linear-gradient(var(--b1),var(--b2));color:#fff;font:800 20px/1 inherit;font-family:inherit;
  padding:10px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 8px 0 var(--ink);cursor:pointer;
  text-shadow:0 2px 0 var(--ink),1px 0 var(--ink),-1px 0 var(--ink),0 -1px var(--ink);overflow:hidden}
.btn::before{content:"";position:absolute;left:8px;right:8px;top:5px;height:36%;border-radius:14px;background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.05))}
.btn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ink)}
.btn svg{width:50px;height:50px;position:relative}
.btn .lock{position:absolute;right:6px;top:6px;width:30px;height:30px;display:none}
.btn.locked{filter:saturate(.25) brightness(.9)}
.btn.locked .lock{display:block}
h2{font-size:20px;font-weight:800;margin:22px 6px 8px}
h2 small{font-size:14px;font-weight:700;opacity:.65;margin-left:8px}
.stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.card{background:var(--cb);border:4px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:6px 6px 10px;text-align:center;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:0 9px 0 var(--ink)}
.card.on{transform:translateY(-8px);box-shadow:0 14px 0 var(--ink);outline:4px solid #ff4f8b;outline-offset:3px}
.card svg{display:block;width:100%;height:auto;border-radius:14px}
.card .n{font-size:21px;font-weight:800;line-height:1.1;margin-top:4px}
.card .a{font-size:13px;font-weight:700;opacity:.7}
.card .m{font-size:14px;font-weight:700;line-height:1.15;margin-top:2px}
@media(max-width:760px){
  .gauges{position:static;grid-template-columns:repeat(2,minmax(0,1fr));padding:10px;background:#ffe9b0;border-bottom:4px solid var(--ink)}
  .gauge .lbl{white-space:nowrap}.gauge .lbl span:first-child{display:none}.gauge .lbl{justify-content:flex-end}
  .food{min-width:0;flex:1 1 40%}.food svg{width:40px;height:40px}.food .n{font-size:14px}
  .actions{gap:6px}.btn{font-size:11.5px;border-radius:14px;border-width:3px;padding:8px 0}.btn svg{width:34px;height:34px}
  .stages{grid-template-columns:repeat(3,minmax(0,1fr))}.logo{font-size:30px}.tray .tt{display:none}
}
/* dessin */
svg .o{stroke:var(--ink);stroke-width:calc(var(--k)*2.6px);stroke-linejoin:round;stroke-linecap:round}
svg .o2{stroke:var(--ink);stroke-width:calc(var(--k)*1.3px);stroke-linejoin:round;stroke-linecap:round}
svg .o3{stroke:var(--ink);stroke-width:calc(var(--k)*1.8px);stroke-linejoin:round;stroke-linecap:round}
svg .ol{stroke:var(--ink);stroke-width:calc(var(--lw,1)*5px);stroke-linejoin:round;stroke-linecap:round}
svg .ol2{stroke:var(--ink);stroke-width:calc(var(--lw,1)*3.2px);stroke-linejoin:round;stroke-linecap:round}
.prop{opacity:0;transition:opacity .5s;pointer-events:none}
svg[data-s=oeuf] .p-oeuf,svg[data-s=bebe] .p-bebe,svg[data-s=ado] .p-ado,svg[data-s=adulte] .p-adulte,svg[data-s=titan] .p-titan{opacity:1}
.breath{animation:breath 2.6s ease-in-out infinite;transform-origin:0 0}
@keyframes breath{50%{transform:scale(1.012,.978)}}
.nod{animation:nod 2.6s ease-in-out infinite;transform-origin:-30px 20px}
@keyframes nod{50%{transform:rotate(2deg)}}
.lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink 4.2s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%,97%{transform:scaleY(1)}}
.wob{animation:wob 1.4s ease-in-out infinite;transform-origin:0 -10px}
@keyframes wob{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-5deg)}80%{transform:rotate(5deg)}90%{transform:rotate(-3deg)}}
.popin{animation:popin .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes popin{0%{transform:scale(.6)}100%{transform:scale(1)}}
.drift{animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(70px)}}
.rays{animation:spin 60s linear infinite;transform-origin:842px 112px}
@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px)}}
.rot{animation:rot .16s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes rot{50%{transform:scaleX(.35)}}
.run{animation:run .45s ease-in-out infinite}
@keyframes run{50%{transform:translateY(-2.5px)}}
.wv{animation:wv 3s ease-in-out infinite alternate}
@keyframes wv{to{transform:translateX(10px)}}
.smk{animation:smk 3.5s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes smk{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:.85}100%{transform:translateY(-70px) scale(1.5);opacity:0}}
.flm{animation:flm .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flm{to{transform:scale(1.12,.86)}}
.flut{animation:flut .3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes flut{to{transform:scaleX(.45)}}
.fly{animation:fly 5s ease-in-out infinite alternate}
@keyframes fly{0%{transform:translate(0,0)}50%{transform:translate(24px,-22px)}100%{transform:translate(-14px,10px)}}
.beam{animation:beam .12s linear infinite alternate}
@keyframes beam{to{opacity:.8}}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.12)}}
.wig{animation:wig 1.8s ease-in-out infinite alternate;transform-origin:0 0}
@keyframes wig{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
/* jeu */
.app.home #game,.app.home .top .chip{display:none}
.app:not(.home) #home{display:none}
#home .card .n{font-size:24px}
.chip.mini{font:inherit;font-weight:800;font-size:14px;color:inherit;cursor:pointer;background:#ffe9b0}
.chip.mini:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.food{font:inherit;color:inherit;text-align:left;cursor:pointer}
.food:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tray.off .food{filter:saturate(.25) brightness(.9)}
.btn.locked{cursor:default}
.card.album{cursor:default}
.card.album:hover{transform:none;box-shadow:0 6px 0 var(--ink)}
.card.album.on,.card.album.on:hover{transform:translateY(-8px);box-shadow:0 14px 0 var(--ink)}
.card.lock .sil{filter:brightness(0);opacity:.3}
#night{transition:opacity 1s;pointer-events:none}
#fx{pointer-events:none}
.sleep #night{opacity:.5}
.sleep .lid{animation:none;transform:scaleY(1)}
.sleep .nod,.sleep .breath{animation-duration:5s}
.sleep .beam{display:none}
#act.jump{animation:jump .75s ease-out}
@keyframes jump{0%,55%,100%{transform:translateY(0)}28%{transform:translateY(-70px)}78%{transform:translateY(-24px)}}
#act.chomp{animation:chomp .45s ease-in-out}
@keyframes chomp{0%,100%{transform:scale(1)}30%{transform:scale(1.07,.92)}65%{transform:scale(.95,1.06)}}
#act.no{animation:no .45s ease-in-out}
@keyframes no{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-14px)}40%,80%{transform:translateX(14px)}}
.screen.shake{animation:shake .5s linear}
@keyframes shake{0%,100%{transform:translate(0)}15%{transform:translate(-8px,5px)}30%{transform:translate(7px,-6px)}45%{transform:translate(-6px,-4px)}60%{transform:translate(6px,5px)}80%{transform:translate(-3px,2px)}}
@media(prefers-reduced-motion:reduce){.screen.shake,#act.jump,#act.chomp,#act.no{animation:none}}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.cell{margin:0;text-align:center}
.cell .frame{border:4px solid var(--ink);border-radius:18px;overflow:hidden;background:var(--cb);box-shadow:0 5px 0 var(--ink)}
.cell svg{display:block;width:100%;height:auto}
.cell figcaption{font-size:16px;font-weight:800;margin-top:8px}
@media(max-width:700px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body>
<div class="app"><div class="top"><div class="logo">KAIJUCHI</div><div class="chip stage">Planche des personnages</div></div><div id="planche"></div></div>
<script>
const L='#2a2140';
function mb(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const f=n=>(+n).toFixed(1),f2=n=>(+n).toFixed(2),IV='#fff8e1';
function star(cx,cy,R,r,n){let s='';for(let i=0;i<n*2;i++){const a=Math.PI*i/n-Math.PI/2,q=i%2?r:R;s+=f(cx+Math.cos(a)*q)+','+f(cy+Math.sin(a)*q)+' '}return s}

/* ---------- stades ---------- */
const ST={
 oeuf:{n:'Œuf',z:5,m:.8,next:'vers Bébé',evo:35,day:'0',w:'2 kg',dmg:'aucun',age:'Jour 0',col:'#ffd166',cb:'radial-gradient(circle at 50% 35%,#fff7d6,#ffd98a)',vb:'-150 -235 300 265',
  menu:[['flame','Chaleur','éclosion'],['heart','Câlins','+ humeur']],short:'Chaleur et câlins',bub:[660,300,'heart'],pop:[340,330,'TOC TOC']},
 bebe:{n:'Bébé',z:4,m:.78,next:'vers Ado',evo:48,day:'2',w:'12 kg',dmg:'1 pot de fleurs',age:'Jours 1 à 3',col:'#b6f06a',cb:'radial-gradient(circle at 50% 35%,#f1ffd0,#b9ec7a)',vb:'-185 -258 360 290',
  bs:.55,hs:.95,ss:.5,es:1.28,brow:-10,pup:.62,teeth:1,cheek:1,hat:1,
  menu:[['butterfly','Papillon','+5 faim'],['apple','Pomme','+10 faim'],['fish','Poisson','+15 faim'],['ladybug','Coccinelle','+4 faim']],short:'Insectes, fruits, poissons',bub:[650,255,'apple'],pop:[330,310,'MIAM !']},
 ado:{n:'Ado',z:2,m:.86,next:'vers Adulte',evo:64,day:'12',w:'900 kg',dmg:'3 voitures',age:'Jours 4 à 14',col:'#5fe0a2',cb:'radial-gradient(circle at 50% 35%,#dcfff0,#84e6bd)',vb:'-240 -332 440 360',
  bs:.78,hs:.96,ss:.75,es:1.1,brow:2,pup:.54,teeth:2,cheek:1,
  menu:[['cow','Vache','+30 faim'],['tree','Arbre','+20 faim'],['car','Voiture','+45 faim'],['lamp','Lampadaire','+12 faim']],short:'Vaches, arbres, voitures',bub:[690,190,'car'],pop:[300,235,'SCRONCH !']},
 adulte:{n:'Adulte',z:1,m:.92,next:'vers Titan',evo:30,day:'31',w:'60 tonnes',dmg:'2 quartiers',age:'Jours 15 à 40',col:'#58d0c3',cb:'radial-gradient(circle at 50% 35%,#dff7ff,#8fd3f0)',vb:'-290 -398 520 420',
  bs:1,hs:1,ss:1,es:1,brow:12,pup:.46,teeth:3,hold:1,
  menu:[['boat','Bateau','+120 faim'],['heli','Hélicoptère','+90 faim'],['crowd','Foule ×10','+60 faim'],['bus','Bus','+150 faim']],short:'Bateaux, hélicos, foules',bub:[285,160,'boat'],pop:[770,300,'CROUNCH !']},
 titan:{n:'Titan',z:.5,m:1,next:'stade final',evo:100,day:'58',w:'20 000 tonnes',dmg:'4 villes',age:'Jour 41 et plus',col:'#b59cff',cb:'radial-gradient(circle at 50% 35%,#ffe3f3,#ffa9c9)',vb:'-335 -440 590 475',
  bs:1.15,hs:.96,ss:1.35,es:.92,brow:20,slit:1,teeth:4,glow:1,scar:1,beam:1,
  menu:[['building','Immeuble','+800 faim'],['cargo','Cargo','+600 faim'],['district','Quartier','+2 500 faim']],short:'Immeubles, quartiers, villes',bub:null,pop:[250,140,'GRAOUUU !']}
};
const ORDER=['oeuf','bebe','ado','adulte','titan'];

/* ---------- petits objets ---------- */
function car(x,y,col,dir=1,sc=1){return `<g transform="translate(${x},${y}) scale(${dir*sc},${sc})">
<ellipse cx="0" cy="1" rx="38" ry="4" fill="${L}" opacity=".22"/>
<path class="o" d="M-35 -9 C-35 -18,-29 -20,-21 -21 L-13 -32 C-11 -35,-7 -36,-1 -36 L12 -36 C18 -36,22 -33,25 -29 L30 -20 C37 -19,37 -12,37 -7 L37 -4 L-35 -4 Z" fill="${col}"/>
<path d="M-33 -9 L36 -9 L36 -5 L-33 -5 Z" fill="${L}" opacity=".18"/>
<path class="o2" d="M-10 -22 L-5 -31 L4 -31 L4 -22 Z" fill="#d4f2ff"/><path class="o2" d="M8 -22 L8 -31 L13 -31 C16 -31,19 -28,22 -22 Z" fill="#d4f2ff"/>
<path d="M-18 -18 L24 -18" stroke="#fff" stroke-width="1.6" opacity=".55"/>
<rect class="o2" x="31" y="-16" width="5" height="5" rx="2" fill="#fff2a0"/><rect class="o2" x="-35" y="-16" width="4" height="5" rx="1.5" fill="#ff4f5e"/>
<circle class="o2" cx="-18" cy="-4" r="7.5" fill="#3a3152"/><circle cx="-18" cy="-4" r="3" fill="#cfd6e6"/>
<circle class="o2" cx="20" cy="-4" r="7.5" fill="#3a3152"/><circle cx="20" cy="-4" r="3" fill="#cfd6e6"/></g>`}
function bus(x,y,col,dir=1){let w='';for(let i=0;i<5;i++)w+=`<rect class="o2" x="${-42+i*17}" y="-36" width="13" height="13" rx="2" fill="#d4f2ff"/>`;
return `<g transform="translate(${x},${y}) scale(${dir},1)"><ellipse cx="0" cy="1" rx="54" ry="4" fill="${L}" opacity=".22"/>
<rect class="o" x="-50" y="-44" width="100" height="40" rx="8" fill="${col}"/><rect x="-49" y="-20" width="98" height="6" fill="#fff" opacity=".85"/>${w}
<rect class="o2" x="43" y="-18" width="6" height="6" rx="2" fill="#fff2a0"/>
<circle class="o2" cx="-30" cy="-4" r="8" fill="#3a3152"/><circle cx="-30" cy="-4" r="3.2" fill="#cfd6e6"/><circle class="o2" cx="30" cy="-4" r="8" fill="#3a3152"/><circle cx="30" cy="-4" r="3.2" fill="#cfd6e6"/></g>`}
const SKIN=['#ffd9b3','#f3c19a','#c98a5e','#8d5a3b'],SHIRT=['#ff5a5a','#ffd23f','#4db8ff','#5ed36a','#b58cff','#ff8fc0','#ffffff','#ff9a3c'],HAIR=['#3a2a1e','#6b4423','#f2c04a','#1d1a2b','#c9502e'];
const grp=a=>`<g class="run">${a.filter((_,i)=>i%2).join('')}</g><g class="run" style="animation-delay:-.22s">${a.filter((_,i)=>!(i%2)).join('')}</g>`;
function person(x,y,i,dir=1,sc=1){return `<g transform="translate(${f(x)},${f(y)}) scale(${dir*sc},${sc})"><g>
<path class="o2" d="M-1.5 -6 l-3.5 6 M1.5 -6 l4.5 4.5" fill="none"/>
<rect class="o2" x="-3.4" y="-14" width="6.8" height="8.6" rx="2.6" fill="${SHIRT[i%8]}"/>
<path class="o2" d="M-3 -12.5 l-4.5 -6 M3 -12.5 l4.5 -6.5" fill="none"/>
<circle class="o2" cx="0" cy="-17.5" r="3.6" fill="${SKIN[i%4]}"/><path d="M-3.6 -18 a3.6 3.6 0 0 1 7.2 0 Z" fill="${HAIR[i%5]}"/></g></g>`}
function tree(x,y,s=1,g=0){const C=[['#48c768','#2f9e52','#8ee89f'],['#6fd24a','#45a52f','#b0f08a'],['#34b98a','#1f8f6c','#7fe3c0']][g%3];
const b=[[-11,-30,12],[11,-30,12],[0,-43,14]];return `<g transform="translate(${x},${y}) scale(${s})"><rect class="o3" x="-3.2" y="-22" width="6.4" height="22" rx="1.5" fill="#9a6a3f"/>
${b.map(c=>`<circle class="o" cx="${c[0]}" cy="${c[1]}" r="${c[2]}" fill="${C[0]}"/>`).join('')}${b.map(c=>`<circle cx="${c[0]}" cy="${c[1]}" r="${c[2]-.6}" fill="${C[0]}"/>`).join('')}
<path d="M-18 -24 a12 12 0 0 0 22 4 a12 12 0 0 0 17 -6 a12 12 0 0 1 -12 8 l-16 0 a12 12 0 0 1 -11 -6z" fill="${C[1]}" opacity=".7"/>
